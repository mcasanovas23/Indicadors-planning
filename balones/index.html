// Fuerza recarga si el navegador tiene versión en caché más antigua
(function(){
  const TS = '23/06/2026 11:48';
  const KEY = 'balones_last_ts';
  const prev = sessionStorage.getItem(KEY);
  if(prev && prev !== TS){
    sessionStorage.setItem(KEY, TS);
    location.reload(true);
    return;
  }
  sessionStorage.setItem(KEY, TS);
  // Muestra tiempo transcurrido desde generación
  function showAge(){
    const el = document.getElementById('gen-age');
    if(!el) return;
    const parts = TS.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)/);
    if(!parts) return;
    const gen = new Date(+parts[3], +parts[2]-1, +parts[1], +parts[4], +parts[5]);
    const mins = Math.round((Date.now()-gen)/60000);
    if(mins < 2) el.textContent = '(recién generado)';
    else if(mins < 60) el.textContent = '(hace ' + mins + ' min)';
    else el.textContent = '(hace ' + Math.round(mins/60) + 'h)';
  }
  showAge();
  setInterval(showAge, 60000);
})();
</script>

function isoWeekFromISODate(s){
  if(!s) return 0;
  const parts=String(s).split('-');
  if(parts.length<3) return 0;
  const d=new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
  const day=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  const target=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1+Math.round(((d-target)/86400000-3+((target.getUTCDay()+6)%7))/7);
}
function isValidSE69(v){
  // Una Ref SE69 es válida cuando hay realmente un bulk común detrás.
  // Vacío, null, espacios o el placeholder '-' significan "no hay bulk":
  // esas filas NO se agrupan como BULK.
  if(v===null || v===undefined) return false;
  const s = String(v).trim();
  if(!s) return false;
  if(s === '-' || s === '—' || s === '–') return false;
  return true;
}
function bulkKeyMQ(row){
  // BULK real: solo cuando la fila tiene una Ref SE69 válida. Cubre el caso
  // típico "6 órdenes de 30 ud = 1 bulk SE69 de 180 ud". Cuando no hay
  // SE69, las filas se agrupan visualmente con seqKeyMQ (mismo color, sin
  // badge ni vinculación de la casilla Lanzada).
  if(!isValidSE69(row.se69)) return null;
  const wk = isoWeekFromISODate(row.fecha);
  return 'BMQ:'+String(row.se69).trim()+':W'+wk;
}
function seqKeyMQ(row){
  // Agrupación SOLO VISUAL para órdenes consecutivas SIN bulk SE69:
  // misma Ref SE1 fabricada el mismo día en la misma máquina. Se pintan
  // con el mismo color pero NO llevan etiqueta de Bulk y cada línea
  // se marca/desmarca como Lanzada de forma independiente.
  if(isValidSE69(row.se69)) return null;
  if(!row.se1 || !row.fecha) return null;
  return 'SEQ:'+row.se1+':'+row.fecha;
}
function bulkKeyCorte(row){
  // Corte de colas: solo se agrupa como bulk cuando hay Ref SE69 real.
  if(!isValidSE69(row.se69)) return null;
  return 'BC:'+String(row.se69).trim()+':'+(row.fecha_corte||'');
}
function lanzadaStorageGet(key){
  try { return localStorage.getItem(key)==='1'; } catch(e){ return false; }
}
function lanzadaStorageSet(key, v){
  try {
    if(v) localStorage.setItem(key,'1');
    else localStorage.removeItem(key);
  } catch(e){}
}

const rendered={};
function activate(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.tab-content').forEach(s=>s.classList.toggle('active', s.id===id));
  if(!rendered[id]){ render(id); rendered[id]=true; }
  setTimeout(()=>Object.values(window._charts||{}).forEach(c=>c.resize()), 50);
}
window._charts={};

function render(id){
  const sec=document.getElementById(id);
  if(id==='dashboard') return renderDashboard(sec);
  if(id==='kanban')    return renderKanban(sec);
  if(id==='corte') return renderCorte(sec);
  if(id==='pa_entrega') return renderPaEntrega(sec);
  if(id==='pa_inv') return renderPaInv(sec);
  if(id==='no_asig') return renderNoAsig(sec);
  if(id==='en_riesgo') return renderEnRiesgo(sec);
}

function renderEnRiesgo(sec){
  const filas = PLANNING.pa_entrega.filter(r => r.cumple_min === 'No');

  sec.innerHTML =

function buildTable(container, cols, rows, opts){
  opts = opts || {};
  const bulkKeyFn = opts.bulkKeyFn || null;
  const seqKeyFn  = opts.seqKeyFn  || null;  // agrupación sólo VISUAL (sin badge ni checkbox enlazado)
  const lanzadaKey = opts.lanzadaKey || null;
  const rowIdFn   = opts.rowIdFn   || null;
  const BULK_CAP  = opts.bulkCap || 180;

  const wrap=document.createElement('div'); wrap.className='table-wrap';
  const tbl=document.createElement('table'); tbl.className='data';
  const thead=document.createElement('thead');
  const trH=document.createElement('tr');
  cols.forEach((c,idx)=>{
    const th=document.createElement('th');
    if(c.lanzada){
      th.innerHTML='✓ '+c.t;
      th.style.minWidth='80px';
      th.style.textAlign='center';
      th.style.cursor='default';
    } else {
      th.innerHTML=c.t+' <span style="font-size:10px;opacity:.7">&#x21C5;</span>';
      th.dataset.col=idx;
      th.addEventListener('click', ()=>sortBy(idx));
    }
    trH.appendChild(th);
  });
  thead.appendChild(trH);
  const trF=document.createElement('tr'); trF.className='filter';
  cols.forEach((c,idx)=>{
    const th=document.createElement('th');
    if(!c.lanzada){
      const inp=document.createElement('input'); inp.placeholder='filtrar...'; inp.dataset.col=idx;
      inp.addEventListener('input', applyFilters); th.appendChild(inp);
    }
    trF.appendChild(th);
  });
  thead.appendChild(trF);
  tbl.appendChild(thead);
  const tbody=document.createElement('tbody'); tbl.appendChild(tbody);

  // === Pre-cálculo de grupos bulk con tope de BULK_CAP unidades ===
  // Para cada fila asignamos su "effective bulkKey" = baseKey + '#' + subIdx,
  // de modo que un grupo lógico se parte en subgrupos cada vez que su suma
  // acumulada superaría BULK_CAP. Así nunca aparece un sombreado > 180 ud.
  const rowEffKey = new Map();
  const groupColor = {};
  const groupTotal = {};
  const groupSize  = {};
  const groupMembers = {};
  if(bulkKeyFn){
    const subIdx = {};
    const subTot = {};
    rows.forEach(r=>{
      const base = bulkKeyFn(r);
      if(!base) return;
      const qty = Number(r.qty)||0;
      if(!(base in subIdx)) subIdx[base] = 0;
      let idx = subIdx[base];
      let curKey = base+'#'+idx;
      let curTot = subTot[curKey]||0;
      if(curTot > 0 && curTot + qty > BULK_CAP){
        idx += 1;
        subIdx[base] = idx;
        curKey = base+'#'+idx;
        curTot = 0;
      }
      subTot[curKey] = curTot + qty;
      rowEffKey.set(r, curKey);
      groupSize[curKey] = (groupSize[curKey]||0) + 1;
      groupTotal[curKey] = (groupTotal[curKey]||0) + qty;
      if(!groupMembers[curKey]) groupMembers[curKey] = [];
      groupMembers[curKey].push(r);
    });
    let cidx = 0;
    rows.forEach(r=>{
      const k = rowEffKey.get(r);
      if(!k || groupColor[k] || (groupSize[k]||0) < 2) return;
      groupColor[k] = 'bulk-c' + ((cidx % 12) + 1);
      cidx++;
    });
  }
  function effBulkKey(r){ return rowEffKey.get(r) || null; }

  // === Pre-cálculo de grupos SECUENCIALES (sólo color visual) ===
  // No tienen bulk SE69, pero comparten SE1 y día de fabricación: se ejecutan
  // de forma consecutiva en la máquina. Las pintamos del mismo color para
  // mostrar esa continuidad, pero SIN etiqueta "Bulk X ud" y SIN enlazar
  // las casillas "Lanzada" (cada órden se lanza por separado).
  const rowSeqKey = new Map();
  const seqColor = {};
  const seqSize  = {};
  if(seqKeyFn){
    rows.forEach(r=>{
      const k = seqKeyFn(r);
      if(!k) return;
      rowSeqKey.set(r, k);
      seqSize[k] = (seqSize[k]||0) + 1;
    });
    let sidx = 0;
    rows.forEach(r=>{
      const k = rowSeqKey.get(r);
      if(!k || seqColor[k] || (seqSize[k]||0) < 2) return;
      // Paleta desplazada (empezamos por c7) para distinguir visualmente
      // de los grupos BULK reales.
      seqColor[k] = 'bulk-c' + (((sidx + 6) % 12) + 1);
      sidx++;
    });
  }
  function effSeqKey(r){ return rowSeqKey.get(r) || null; }

  function rowLanzadaKey(r){
    if(!lanzadaKey || !rowIdFn) return null;
    const id = rowIdFn(r); if(!id) return null;
    return lanzadaKey+':'+id;
  }
  function isLanzada(r){
    const k = rowLanzadaKey(r);
    return k ? lanzadaStorageGet(k) : false;
  }
  function setLanzadaForRow(r, v){
    // Si la fila pertenece a un grupo bulk, marcar/desmarcar TODAS las del grupo.
    const ek = effBulkKey(r);
    const targets = (ek && groupMembers[ek] && groupMembers[ek].length>1) ? groupMembers[ek] : [r];
    targets.forEach(rr=>{
      const k = rowLanzadaKey(rr);
      if(k) lanzadaStorageSet(k, v);
    });
  }

  let state={sortIdx:-1, asc:true, filters:{}};
  function rowMatches(r){
    for(const idx in state.filters){
      const f=state.filters[idx]; if(!f) continue;
      const c=cols[idx];
      let raw;
      if(c.lanzada) raw = isLanzada(r) ? 'si lanzada' : 'no pendiente';
      else raw = r[c.k];
      const v=(raw===null||raw===undefined?'':String(raw)).toLowerCase();
      if(!v.includes(f)) return false;
    }
    return true;
  }
  function paint(){
    let arr=rows.filter(rowMatches);
    if(state.sortIdx>=0){
      const c=cols[state.sortIdx]; const key=c.sortBy||c.k;
      arr=arr.slice().sort((a,b)=>{
        let va=a[key], vb=b[key];
        if(c.n){va=Number(va)||0; vb=Number(vb)||0;}
        else {va=String(va||'').toLowerCase(); vb=String(vb||'').toLowerCase();}
        if(va<vb) return state.asc?-1:1;
        if(va>vb) return state.asc?1:-1;
        return 0;
      });
    }
    tbody.innerHTML='';
    const frag=document.createDocumentFragment();
    let lanzadasCount = 0;
    // Mostrar el badge "Bulk X ud" al inicio de CADA bloque visual contiguo
    // del mismo grupo, no solo la primera aparición global. Si el grupo está
    // partido por filas intermedias de otros SE69, cada tramo lleva su propio badge.
    let prevBkey = null;
    arr.forEach(r=>{
      const tr=document.createElement('tr');
      let bkey=null, bclass=null, showBadge=false;
      if(bulkKeyFn){
        bkey = effBulkKey(r);
        if(bkey && groupColor[bkey]){
          bclass = groupColor[bkey];
          if(bkey !== prevBkey){ showBadge=true; }
        }
      }
      // Si no hay BULK real, intentamos colorear como grupo secuencial.
      if(!bclass && seqKeyFn){
        const sk = effSeqKey(r);
        if(sk && seqColor[sk]) bclass = seqColor[sk];
      }
      prevBkey = bkey;
      const lanz = isLanzada(r);
      if(lanz) lanzadasCount++;
      const classes=[];
      if(bclass) classes.push(bclass);
      if(lanz) classes.push('lanzada-row');
      if(classes.length) tr.className = classes.join(' ');
      if(r.pl_se_nivel===2) tr.classList.add('plse-2');
      else if(r.pl_se_nivel===3) tr.classList.add('plse-3');
      cols.forEach(c=>{
        const td=document.createElement('td');
        if(c.lanzada){
          const cb=document.createElement('input');
          cb.type='checkbox';
          cb.className='lanzada-cb';
          cb.checked = lanz;
          const ek_cb = effBulkKey(r);
          const linked = !!(ek_cb && groupMembers[ek_cb] && groupMembers[ek_cb].length>1);
          cb.title = linked
            ? 'Marcar la orden como LANZADA (se guarda en este navegador). Esta fila pertenece a un BULK SE69, así que al marcarla se marcan también el resto de filas del grupo.'
            : 'Marcar la orden como LANZADA (se guarda en este navegador). Cada órden se lanza por separado.';
          cb.addEventListener('change', ()=>{
            setLanzadaForRow(r, cb.checked);
            paint();
          });
          td.appendChild(cb);
          td.style.textAlign='center';
        } else {
          const raw=r[c.k];
          if(c.render) td.innerHTML=c.render(raw, r);
          else if(c.n){td.textContent=fmt(raw); td.style.textAlign='right';}
          else td.textContent=raw===null||raw===undefined?'':String(raw);
          if(c.k==='qty' && showBadge){
            const dot='<span class="bulk-dot" style="background:'+bulkDotColor(bclass)+'"></span>';
            const inner = td.innerHTML;
            // Badge a la IZQUIERDA del qty para que el número quede alineado a la derecha igual que el resto de filas del grupo.
            td.innerHTML = '<span class="bulk-total" title="Bulk SE69 — suma total del grupo sombreado (máx '+BULK_CAP+' ud)">Bulk '+FMT.format(groupTotal[bkey])+' ud</span> ' + dot + inner;
            td.style.textAlign='right';
          }
        }
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    let txt = arr.length+' filas';
    if(lanzadaKey) txt += ' · ✓ '+lanzadasCount+' lanzadas';
    countText.textContent = txt;
  }
  function applyFilters(e){
    const idx=e.target.dataset.col; const v=e.target.value.trim().toLowerCase();
    if(v) state.filters[idx]=v; else delete state.filters[idx];
    paint();
  }
  function sortBy(idx){
    if(cols[idx] && cols[idx].lanzada) return;
    if(state.sortIdx===idx) state.asc=!state.asc;
    else {state.sortIdx=idx; state.asc=true;}
    paint();
  }
  function bulkDotColor(cls){
    const M={'bulk-c1':'#F9A825','bulk-c2':'#00897B','bulk-c3':'#D81B60','bulk-c4':'#3949AB',
             'bulk-c5':'#E64A19','bulk-c6':'#7CB342','bulk-c7':'#5E35B1','bulk-c8':'#C0CA33',
             'bulk-c9':'#039BE5','bulk-c10':'#E53935','bulk-c11':'#6D4C41','bulk-c12':'#546E7A'};
    return M[cls]||'#999';
  }
  const countEl=document.createElement('div');
  countEl.style.cssText='font-size:12px;color:#666;margin-top:6px;display:flex;align-items:center;gap:10px;';
  const countText=document.createElement('span');
  countEl.appendChild(countText);
  if(lanzadaKey){
    const btn=document.createElement('button');
    btn.className='lanzada-clear';
    btn.textContent='Limpiar lanzadas';
    btn.title='Desmarca todas las casillas Lanzada de esta tabla';
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Desmarcar todas las casillas Lanzada de esta tabla?')) return;
      rows.forEach(r=>{ const k = rowLanzadaKey(r); if(k) lanzadaStorageSet(k, false); });
      paint();
    });
    countEl.appendChild(btn);
  }
  wrap.appendChild(tbl);
  container.appendChild(wrap);
  container.appendChild(countEl);
  paint();
}

const kanbanMoves = {};      // cardId -> {mq, fecha, fecha_es}
let pinUnlocked = false;
function checkPin(){
  const val = document.getElementById('pin-input').value;
  const statusEl = document.getElementById('pin-status');
  const widget = document.getElementById('pin-widget');
  if(val === '0110'){
    pinUnlocked = true;
    statusEl.textContent = '✓ Acceso';
    statusEl.style.color = '#86EFAC';
    widget.classList.add('pin-unlocked');
    document.getElementById('pin-input').disabled = true;
    document.querySelector('.pin-btn').disabled = true;
    document.querySelector('.pin-btn').style.opacity = '.5';
    _refreshKanban();
  } else {
    statusEl.textContent = '✗ PIN incorrecto';
    statusEl.style.color = '#FCA5A5';
    document.getElementById('pin-input').value = '';
  }
}
// Allow Enter key in PIN input
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('pin-input');
  if(inp) inp.addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });
});
const kanbanStatus = {};     // cardId -> 'lanzado'|'parison'|'balon'|'colas'
const kanbanIncidencias = {}; // cardId -> tirada data
const kanbanCardData = {};   // cardId -> tirada data

function cardId(origMq, origFecha, se1){
  return origMq + '|' + origFecha + '|' + se1;
}

function buildTiradas(mq, rows){
  const groups = {};
  rows.forEach(r => {
    const key = r.fecha + '|' + r.se1;
    if(!groups[key]){
      groups[key] = {
        mq, origMq: mq, origFecha: r.fecha,
        fecha: r.fecha, fecha_es: r.fecha_es,
        se1: r.se1, descripcion: r.descripcion,
        rows: [], totalQty: 0,
        semanas: [], origenSet: [], comanda: false,
        pl_se_nivel: 0
      };
    }
    const g = groups[key];
    g.rows.push(r);
    g.totalQty += r.qty || 0;
    if(r.semana_pa && !g.semanas.includes(r.semana_pa)) g.semanas.push(r.semana_pa);
    const ori = (r.origen||'').split(' ')[0];
    if(ori && !g.origenSet.includes(ori)) g.origenSet.push(ori);
    if(r.comanda) g.comanda = true;
    if((r.pl_se_nivel||0) > g.pl_se_nivel) g.pl_se_nivel = r.pl_se_nivel;
  });
  return Object.values(groups);
}

// Kanban semanal: usa PLANNING.por_semana_kanban
function buildTiradasSem(mq, rows){
  // rows: lista de row_dicts para (semana, mq)
  // En modo plano (semana_fab=0) cada lote es tarjeta individual (clave = lote_pa)
  const esPlano = rows.length > 0 && (rows[0].semana_fab === 0 || rows[0].semana_fab === '0');
  const groups = {};
  const groupOrder = [];
  rows.forEach(r => {
    const key = esPlano ? (r.lote_pa || r.se1) : r.se1;
    if(!groups[key]){
      groups[key] = {
        mq, origMq: mq, origSemana: r.semana_fab,
        se1: r.se1, descripcion: r.descripcion,
        rows: [], totalQty: 0,
        semanas: [], origenSet: [], comanda: false,
        pl_se_nivel: 0, semana_adelantado: 0
      };
      groupOrder.push(key);
    }
    const g = groups[key];
    g.rows.push(r);
    g.totalQty += r.qty || 0;
    if(r.semana_pa && !g.semanas.includes(r.semana_pa)) g.semanas.push(r.semana_pa);
    const ori = (r.origen||'').split(' ')[0];
    if(ori && !g.origenSet.includes(ori)) g.origenSet.push(ori);
    if(r.comanda) g.comanda = true;
    if((r.pl_se_nivel||0) > g.pl_se_nivel) g.pl_se_nivel = r.pl_se_nivel;
    if(r.semana_adelantado > g.semana_adelantado) g.semana_adelantado = r.semana_adelantado;
  });
  return groupOrder.map(k => groups[k]);
}

function getCurrentCellData(){
  // Returns map: "{mq}|{fecha}" -> [tirada, ...]  (after applying kanbanMoves)
  const cells = {};
  PLANNING.orden_mq.forEach(mq => {
    const mqData = PLANNING.por_mq[mq];
    if(!mqData) return;
    buildTiradas(mq, mqData.rows).forEach(tirada => {
      const cId = cardId(tirada.origMq, tirada.origFecha, tirada.se1);
      kanbanCardData[cId] = tirada;
      const move = kanbanMoves[cId];
      const curMq    = move ? move.mq    : tirada.mq;
      const curFecha = move ? move.fecha : tirada.fecha;
      const curFechaEs = move ? move.fecha_es : tirada.fecha_es;
      const cellKey = curMq + '|' + curFecha;
      if(!cells[cellKey]) cells[cellKey] = {mq: curMq, fecha: curFecha, fecha_es: curFechaEs, tiradas: []};
      cells[cellKey].tiradas.push({...tirada, mq: curMq, fecha: curFecha, fecha_es: curFechaEs, cId});
    });
  });
  return cells;
}

function _makeOccBar(mq, sem, usedUd){
  const capDia = (PLANNING.cap_diaria || {})[mq] || 0;
  const dias = (PLANNING.dias_lab || {})[String(sem)] || 5;
  const capTotal = capDia * dias;
  const pct = capTotal > 0 ? Math.round(usedUd / capTotal * 100) : 0;
  const bar = document.createElement('div');
  bar.className = 'kc-occ';
  const fill = document.createElement('div');
  fill.className = 'kc-occ-bar ' + (pct >= 100 ? 'over' : pct >= 85 ? 'warn' : 'ok');
  fill.style.width = Math.min(pct, 100) + '%';
  bar.appendChild(fill);
  const txt = document.createElement('div');
  txt.className = 'kc-occ-text';
  txt.textContent = fmt(usedUd) + ' / ' + fmt(capTotal) + '  ' + pct + '%';
  bar.appendChild(txt);
  return bar;
}

function renderKanban(sec){
  sec.innerHTML = '';
  const changesBar = document.createElement('div');
  changesBar.style.cssText = 'min-height:18px;margin-bottom:4px';
  const changesEl = document.createElement('span');
  changesEl.className = 'kt-changes';
  changesEl.id = 'kanban-changes-count';
  changesBar.appendChild(changesEl);
  sec.appendChild(changesBar);

  // Top scrollbar mirror
  const scrollTop = document.createElement('div');
  scrollTop.className = 'kanban-scroll-top';
  scrollTop.id = 'kanban-scroll-top';
  const scrollTopInner = document.createElement('div');
  scrollTopInner.className = 'kanban-scroll-top-inner';
  scrollTop.appendChild(scrollTopInner);
  sec.appendChild(scrollTop);

  const wrap = document.createElement('div');
  wrap.className = 'panel kanban-wrap';
  wrap.id = 'kanban-scroll-wrap';
  sec.appendChild(wrap);

  const psk = PLANNING.por_semana_kanban || {};
  // Collect all semanas
  const allSemSet = new Set(Object.keys(psk).map(Number));
  // also from kanban moves
  Object.values(kanbanMoves).forEach(m => { if(m.semana) allSemSet.add(m.semana); });
  const allSems = Array.from(allSemSet).sort((a,b)=>a-b);

  if(!allSems.length){
    wrap.innerHTML = '<p style="padding:16px;color:#888">Sin datos de planificación semanal.</p>';
    return;
  }

  // Modo plano: si solo hay un bloque "0", no mostramos columna de semana
  const modoPlano = allSems.length === 1 && allSems[0] === 0;

  // Zona de incidencias
  const incZone = document.createElement('div');
  incZone.className = 'incidencias-zone';
  incZone.id = 'kanban-incidencias-zone';
  const incIcon = document.createElement('span');
  incIcon.textContent = '⚠';
  incIcon.style.cssText = 'color:#fff;margin-right:6px;font-size:14px';
  incZone.appendChild(incIcon);
  const incLabel = document.createElement('span');
  incLabel.textContent = 'Incidencias';
  incZone.appendChild(incLabel);
  const incCount = document.createElement('span');
  incCount.className = 'inc-count';
  incCount.id = 'inc-count-badge';
  const nInc = Object.keys(kanbanIncidencias).length;
  if(nInc > 0){ incCount.textContent = nInc; incCount.style.display='inline-block'; }
  else { incCount.style.display='none'; }
  incZone.appendChild(incCount);
  incZone.addEventListener('dragover', e => { if(!pinUnlocked) return; e.preventDefault(); incZone.classList.add('drag-over'); });
  incZone.addEventListener('dragleave', () => incZone.classList.remove('drag-over'));
  incZone.addEventListener('drop', e => { if(!pinUnlocked) return;
    e.preventDefault();
    incZone.classList.remove('drag-over');
    const cId = e.dataTransfer.getData('text/plain');
    if(cId && kanbanCardData[cId]){
      kanbanIncidencias[cId] = kanbanCardData[cId];
      delete kanbanMoves[cId];
      _refreshKanban();
    }
  });
  incZone.addEventListener('click', e => {
    if(e.target.closest('.inc-return-btn')) return;
    _showIncidenciasPopup();
  });
  const incBar = document.createElement('div');
  incBar.style.cssText = 'display:flex;justify-content:flex-end;margin-bottom:4px;';
  incBar.appendChild(incZone);
  wrap.appendChild(incBar);

  const tbl = document.createElement('table');
  tbl.className = 'kanban-table';

  // Header row
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  if(!modoPlano){
    const thSem = document.createElement('th');
    thSem.className = 'col-fecha';
    headerRow.appendChild(thSem);
  }
  PLANNING.orden_mq.forEach(mq => {
    const th = document.createElement('th');
    const cap = PLANNING.por_mq[mq]?.capacidad || '';
    th.innerHTML = 'MQ ' + mq + (cap ? '<br><span style="font-weight:400;font-size:10px">cap. ' + fmt(cap) + ' ud/día</span>' : '');
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  tbl.appendChild(thead);

  const tbody = document.createElement('tbody');
  allSems.forEach(sem => {
    const semData = psk[String(sem)] || {};
    const tr = document.createElement('tr');

    if(!modoPlano){
      const tdSem = document.createElement('td');
      tdSem.className = 'col-fecha-cell';
      tdSem.textContent = String(sem);
      if(sem === 27){ tdSem.title = 'Planificación calculada — PA S29 no cubiertas'; tdSem.style.cssText='background:#fef3c7;color:#92400e;font-style:italic'; tr.style.background='#fffbeb'; }
      tr.appendChild(tdSem);
    }

    PLANNING.orden_mq.forEach(mq => {
      const td = document.createElement('td');
      td.className = 'kanban-cell';
      td.dataset.mq = mq; td.dataset.semana = sem;

      td.addEventListener('dragover', e => { if(!pinUnlocked) return; e.preventDefault(); td.classList.add('drag-over'); });
      td.addEventListener('dragleave', () => td.classList.remove('drag-over'));
      td.addEventListener('drop', e => { if(!pinUnlocked) return;
        e.preventDefault();
        td.classList.remove('drag-over');
        const cId = e.dataTransfer.getData('text/plain');
        if(!cId) return;
        const orig = kanbanCardData[cId];
        if(!orig) return;
        const newMq = td.dataset.mq;
        const newSem = Number(td.dataset.semana);
        if(newMq === orig.origMq && newSem === orig.origSemana){
          delete kanbanMoves[cId];
        } else {
          kanbanMoves[cId] = {mq: newMq, semana: newSem};
        }
        _refreshKanban();
      });

      // Build tiradas for this cell
      let rows = semData[mq] || [];
      // Apply kanban moves (moved into this cell)
      Object.entries(kanbanMoves).forEach(([cId, mv]) => {
        if(mv.mq === mq && mv.semana === sem){
          const orig = kanbanCardData[cId];
          if(orig) rows = rows.concat(orig.rows || []);
        }
      });
      // Remove rows moved out of this cell
      const movedOut = new Set(
        Object.entries(kanbanMoves)
          .filter(([cId, mv]) => !(mv.mq === mq && mv.semana === sem))
          .map(([cId]) => cId)
      );

      const tiradas = buildTiradasSem(mq, rows).filter(t => {
        const lotKey = (t.rows[0]?.lote_pa) || t.se1;
        const cId = mq + '|' + sem + '|' + lotKey;
        return !movedOut.has(cId) && !kanbanIncidencias[cId];
      });

      // Occupancy bar
      const occUd = tiradas.reduce((s,t) => s + t.rows.reduce((a,r)=>(a+(r.qty_total||r.qty||0)),0), 0);
      td.appendChild(_makeOccBar(mq, sem, occUd));

      tiradas.forEach(tirada => {
        tirada.origMq = mq;
        tirada.origSemana = sem;
        const lotKey = (tirada.rows[0]?.lote_pa) || tirada.se1;
        const cId = mq + '|' + sem + '|' + lotKey;
        tirada.cId = cId;
        kanbanCardData[cId] = tirada;
        const card = _makeKanbanCardSem(tirada);
        td.appendChild(card);
      });

      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);

  // Sync top scrollbar width and scroll events
  requestAnimationFrame(() => {
    scrollTopInner.style.width = tbl.scrollWidth + 'px';
    let syncing = false;
    scrollTop.addEventListener('scroll', () => {
      if(syncing) return; syncing = true;
      wrap.scrollLeft = scrollTop.scrollLeft;
      syncing = false;
    });
    wrap.addEventListener('scroll', () => {
      if(syncing) return; syncing = true;
      scrollTop.scrollLeft = wrap.scrollLeft;
      syncing = false;
    });
  });

  _updateKanbanChangesCount();
  _updateKanbanColWidth(wrap, tbl);
  if(!wrap._resizeObs){ wrap._resizeObs=true; const ro=new ResizeObserver(()=>_updateKanbanColWidth(wrap,tbl)); ro.observe(wrap); }
}

function _makeKanbanCard(tirada){
  const card = document.createElement('div');
  const cId = tirada.cId;
  const isMoved = !!kanbanMoves[cId];
  const origData = kanbanCardData[cId];
  const semHasta = PLANNING.semana_hasta || 0;
  const isFrozen = tirada.semanas.some(s => s <= semHasta);
  const mainOrigen = tirada.origenSet[0] || '';

  card.className = 'kanban-card' + (isMoved ? ' moved' : '');
  card.dataset.origen = mainOrigen;
  if(tirada.pl_se_nivel===2){ card.style.background='#FFFBEB'; card.style.borderLeftColor='#F59E0B'; }
  else if(tirada.pl_se_nivel===3){ card.style.background='#F0FDF4'; card.style.borderLeftColor='#22C55E'; }
  card.draggable = true;
  card.dataset.cid = cId;

  card.addEventListener('dragstart', e => { if(!pinUnlocked){ e.preventDefault(); return; }
    e.dataTransfer.setData('text/plain', cId);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  const refDiv = document.createElement('div');
  refDiv.className = 'kc-ref';
  refDiv.textContent = tirada.se1;
  card.appendChild(refDiv);

  if(tirada.descripcion){
    const descDiv = document.createElement('div');
    descDiv.className = 'kc-desc';
    descDiv.title = tirada.descripcion;
    descDiv.textContent = tirada.descripcion;
    card.appendChild(descDiv);
  }

  const meta = document.createElement('div');
  meta.className = 'kc-meta';

  const qty = document.createElement('span');
  qty.className = 'kc-qty';
  qty.textContent = fmt(tirada.totalQty) + ' ud';
  meta.appendChild(qty);

  tirada.semanas.slice(0,2).forEach(s => {
    const sem = document.createElement('span');
    sem.className = 'kc-sem';
    sem.textContent = 'S' + s;
    meta.appendChild(sem);
  });

  tirada.origenSet.forEach(o => {
    const ori = document.createElement('span');
    ori.className = 'kc-origen ' + o;
    ori.textContent = o;
    meta.appendChild(ori);
  });

  if(tirada.comanda){
    const com = document.createElement('span');
    com.className = 'kc-comanda';
    com.textContent = 'COMANDA';
    meta.appendChild(com);
  }

  if(isFrozen){
    const frz = document.createElement('span');
    frz.className = 'kanban-freeze-badge';
    frz.title = 'Semana congelada — los cambios se guardarán en planning_congelado.json';
    frz.textContent = '🔒';
    meta.appendChild(frz);
  }

  if(isMoved && origData){
    const undo = document.createElement('span');
    undo.style.cssText = 'margin-left:auto;cursor:pointer;font-size:12px;color:var(--magenta);font-weight:700;';
    undo.title = 'Deshacer cambio (volver a MQ ' + origData.origMq + ' · ' + origData.origFecha + ')';
    undo.textContent = '↩';
      undo.addEventListener('click', e => { if(!pinUnlocked){ e.stopPropagation(); return; }
      e.stopPropagation();
      delete kanbanMoves[cId];
      _refreshKanban();
    });
    meta.appendChild(undo);
  }

  card.appendChild(meta);
  return card;
}

function _makeKanbanCardSem(tirada){
  const card = document.createElement('div');
  const cId = tirada.cId;
  const isMoved = !!kanbanMoves[cId];
  const origenCard = (tirada.rows && tirada.rows[0]?.origen) || tirada.origenSet?.[0] || 'PA';
  card.className = 'kanban-card' + (isMoved ? ' moved' : '');
  card.dataset.origen = origenCard;
  if(tirada.pl_se_nivel===2){ card.style.background='#FFFBEB'; card.style.borderLeftColor='#F59E0B'; }
  card.draggable = true;
  card.dataset.cid = cId;

  card.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', cId);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  // Linea 1: REF
  const line1 = document.createElement('div');
  line1.className = 'kc-line1';
  const refSpan = document.createElement('span');
  refSpan.className = 'kc-ref';
  refSpan.textContent = tirada.se1;
  line1.appendChild(refSpan);
  card.appendChild(line1);

  // Linea 2: Lot + descripcion/medidas
  const line2 = document.createElement('div');
  line2.className = 'kc-line2';
  const lotPa = (tirada.rows && tirada.rows[0]?.lote_pa) || '';
  if(lotPa){
    const lotSpan = document.createElement('span');
    lotSpan.className = 'kc-lot';
    lotSpan.textContent = lotPa;
    line2.appendChild(lotSpan);
  }
  if(tirada.descripcion){
    const descSpan = document.createElement('span');
    descSpan.className = 'kc-desc-inline';
    descSpan.textContent = tirada.descripcion;
    line2.appendChild(descSpan);
  }
  card.appendChild(line2);

  // Linea 3: Qty ud + semana PA + C (cubre comanda)
  const line3 = document.createElement('div');
  line3.className = 'kc-line3';
  const totalQ = tirada.rows.reduce((s,r)=>(s+(r.qty_total||r.qty||0)),0);
  const paQ = tirada.rows.reduce((s,r)=>(s+(r.qty||0)),0);
  const stockQ = totalQ - paQ;
  const qtySpan = document.createElement('span');
  qtySpan.className = 'kc-qty-total';
  qtySpan.textContent = fmt(totalQ) + ' ud';
  line3.appendChild(qtySpan);
  if(stockQ > 0){
    const detSpan = document.createElement('span');
    detSpan.className = 'kc-qty-detail';
    detSpan.textContent = '(+'+fmt(stockQ)+'stk)';
    line3.appendChild(detSpan);
  }
  if(tirada.semana_adelantado){
    const advSpan = document.createElement('span');
    advSpan.className = 'kc-adv-week';
    advSpan.textContent = 'S' + tirada.semana_adelantado;
    line3.appendChild(advSpan);
  }
  const semPa = tirada.rows[0]?.semana_pa || 0;
  if(semPa > 0){
    const semSpan = document.createElement('span');
    semSpan.className = 'kc-adv-week';
    semSpan.title = 'Semana necesidad PA';
    semSpan.textContent = 'PA S' + semPa;
    line3.appendChild(semSpan);
  }
  if(tirada.comanda){
    const com = document.createElement('span');
    com.className = 'kc-comanda-badge';
    com.textContent = 'C';
    line3.appendChild(com);
  }
  if(isMoved){
    const undo = document.createElement('span');
    undo.style.cssText = 'margin-left:auto;cursor:pointer;font-size:12px;color:var(--magenta);font-weight:700;';
    undo.title = 'Deshacer cambio';
    undo.textContent = '↩';
    undo.addEventListener('click', e => {
      e.stopPropagation();
      delete kanbanMoves[cId];
      _refreshKanban();
    });
    line3.appendChild(undo);
  }
  card.appendChild(line3);
  // Detalle expandible al hacer click
  const det = document.createElement('div');
  det.className = 'kc-detail';
  tirada.rows.forEach(r => {
    const drow = document.createElement('div');
    drow.className = 'kc-det-row';
    const qspan = document.createElement('span');
    qspan.className = 'kc-det-qty';
    qspan.textContent = fmt(r.qty_total || r.qty || 0) + ' ud';
    drow.appendChild(qspan);
    const dspan = document.createElement('span');
    dspan.className = 'kc-det-dest';
    const spa = (r.semana_pa && r.semana_pa > 0) ? 'PA S'+r.semana_pa : (r.origen==='PP' ? 'PP' : '-');
    dspan.textContent = spa;
    drow.appendChild(dspan);
    if(r.comanda){ const cs=document.createElement('span'); cs.className='kc-det-c'; cs.textContent='C'; drow.appendChild(cs); }
    det.appendChild(drow);
  });
  card.appendChild(det);
  // Botones de estado de fabricacion
  const statusBar = document.createElement('div');
  statusBar.className = 'kc-status-bar';
  const statuses = [{k:'lanzado',l:'Lanzado'},{k:'parison',l:'Parison'},{k:'balon',l:'Balon'},{k:'colas',l:'Colas'}];
  statuses.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'kc-status-btn kc-status-'+s.k;
    btn.textContent = s.l;
    btn.addEventListener('click', e => { if(!pinUnlocked){ e.stopPropagation(); return; }
      e.stopPropagation();
      const cur = kanbanStatus[cId];
      if(cur === s.k){ delete kanbanStatus[cId]; _applyCardStatus(card, null); }
      else { kanbanStatus[cId] = s.k; _applyCardStatus(card, s.k); }
    });
    statusBar.appendChild(btn);
  });
  det.appendChild(statusBar);
  const curSt = kanbanStatus[cId];
  if(curSt) _applyCardStatus(card, curSt);
  card.addEventListener('mouseenter', () => det.classList.add('open'));
  card.addEventListener('mouseleave', () => det.classList.remove('open'));
  return card;
}

function _applyCardStatus(card, status){
  const colorMap = {lanzado:'#FFF9C4',parison:'#C8E6C9',balon:'#2E7D32',colas:'#0D2B5E'};
  const textMap  = {lanzado:'#555',parison:'#1B5E20',balon:'#fff',colas:'#fff'};
  if(!status){
    card.style.background = '';
    card.style.color = '';
    card.querySelectorAll('.kc-ref,.kc-lot,.kc-desc-inline,.kc-qty-total,.kc-adv-week,.kc-det-qty,.kc-det-dest').forEach(el => el.style.color='');
  } else {
    card.style.background = colorMap[status]||'';
    const tc = textMap[status]||'';
    card.querySelectorAll('.kc-ref,.kc-lot,.kc-desc-inline,.kc-qty-total,.kc-adv-week,.kc-det-qty,.kc-det-dest').forEach(el => el.style.color=tc);
  }
}

function _updateKanbanColWidth(wrap, tbl){
  const nCols = PLANNING.orden_mq ? PLANNING.orden_mq.length : 1;
  const available = wrap.clientWidth - 32 - 4*(nCols+1);
  const colW = Math.min(220, Math.max(130, Math.floor(available / nCols)));
  wrap.style.setProperty('--kc-col-w', colW + 'px');
  if(tbl) tbl.style.setProperty('--kc-col-w', colW + 'px');
}

function _showIncidenciasPopup(){
  let popup = document.getElementById('incidencias-popup');
  if(popup){ popup.remove(); return; }
  popup = document.createElement('div');
  popup.id = 'incidencias-popup';
  popup.className = 'incidencias-popup';
  const hdr = document.createElement('div');
  hdr.className = 'inc-popup-hdr';
  hdr.innerHTML = '<span style="font-weight:700;font-size:13px">&#9888; Incidencias</span>';
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.className = 'inc-popup-close';
  closeBtn.addEventListener('click', () => popup.remove());
  hdr.appendChild(closeBtn);
  popup.appendChild(hdr);
  const body = document.createElement('div');
  body.className = 'inc-popup-body';
  const entries = Object.entries(kanbanIncidencias);
  if(!entries.length){
    body.innerHTML = '<p style="color:#888;padding:8px">No hay lotes en incidencias.</p>';
  } else {
    entries.forEach(([cId, tirada]) => {
      const row = document.createElement('div');
      row.className = 'inc-popup-row';
      const info = document.createElement('div');
      const totalQ = (tirada.rows||[]).reduce((s,r)=>s+(r.qty_total||r.qty||0),0);
      info.innerHTML = '<strong>'+tirada.se1+'</strong> &nbsp; '+totalQ+' ud &nbsp; <span style="color:#888;font-size:10px">'+tirada.origMq+'</span>';
      row.appendChild(info);
      const retBtn = document.createElement('button');
      retBtn.className = 'inc-return-btn';
      retBtn.textContent = 'Enviar a planning';
      retBtn.addEventListener('click', e => { if(!pinUnlocked){ e.stopPropagation(); return; }
        e.stopPropagation();
        delete kanbanIncidencias[cId];
        _refreshKanban();
        popup.remove();
      });
      row.appendChild(retBtn);
      body.appendChild(row);
    });
  }
  popup.appendChild(body);
  document.getElementById('kanban').appendChild(popup);
}

function _refreshKanban(){
  const sec = document.getElementById('kanban');
  if(sec) { rendered['kanban'] = false; renderKanban(sec); rendered['kanban'] = true; }
  const btnGuardar = document.getElementById('btn-guardar-kanban');
  if(btnGuardar) btnGuardar.classList.toggle('visible', Object.keys(kanbanMoves).length > 0);
  _updateKanbanChangesCount();
}

function _updateKanbanChangesCount(){
  const el = document.getElementById('kanban-changes-count');
  if(!el) return;
  const n = Object.keys(kanbanMoves).length;
  el.textContent = n > 0 ? n + ' tirada' + (n===1?'':'s') + ' movida' + (n===1?'':'s') + ' (sin guardar)' : '';
}

function guardarCambiosKanban(){
  const n = Object.keys(kanbanMoves).length;
  if(n === 0){ alert('No hay cambios pendientes en el Kanban.'); return; }
  const semHasta = PLANNING.semana_hasta || 0;
  const msg = '¿Guardar los cambios del Kanban?\n\n'
    + n + ' tirada' + (n===1?'':'s') + ' reasignada' + (n===1?'':'s') + '.\n\n'
    + 'Se descargará un archivo planning_congelado.json actualizado.\n'
    + 'DEBES guardarlo en la carpeta del planificador (reemplazando el existente).\n'
    + 'La próxima vez que se ejecute, los cambios se mantendrán.\n\n'
    + (semHasta ? '⚠ Cambios fuera de la semana congelada (S>' + semHasta + ') también se preservarán.' : '');
  if(!confirm(msg)) return;

  // Build new congelado from ALL rows (applying kanbanMoves overrides)
  const congelado = {};

  PLANNING.orden_mq.forEach(mq => {
    const mqData = PLANNING.por_mq[mq];
    if(!mqData) return;
    // group rows into tiradas
    buildTiradas(mq, mqData.rows).forEach(tirada => {
      const cId = cardId(tirada.origMq, tirada.origFecha, tirada.se1);
      const move = kanbanMoves[cId];
      const finalMq    = move ? move.mq    : tirada.mq;
      const finalFecha = move ? move.fecha  : tirada.fecha;
      const isManual   = !!move;

      tirada.rows.forEach(r => {
        const lotePa = String(r.lote_pa || '').trim();
        const sem = r.semana_pa || 0;
        const key = lotePa || (r.se1 + '|' + sem);
        if(!key) return;
        congelado[key] = {
          mq: finalMq,
          fecha_fab: finalFecha,
          semana_pa: sem,
          se1: r.se1,
          manual: isManual
        };
      });
    });
  });

  const json = JSON.stringify(congelado, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planning_congelado.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);

  // Show confirmation
  setTimeout(()=>{
    alert('✅ Descargado planning_congelado.json con ' + Object.keys(congelado).length + ' asignaciones.\n\nGuárdalo en la carpeta del planificador para que los cambios persistan.');
  }, 200);
}

function exportarExcel(){
  if(!window.XLSX){alert('Librería de exportación no disponible. Comprueba la conexión a internet.');return;}
  const wb=window.XLSX.utils.book_new();
  const C={purple:'5B2C7A',magenta:'C8246C',ok:'70AD47',bad:'C00000',lav:'D9C7E5',white:'FFFFFF',grey:'2E2E2E',lgrey:'666666',light:'F4F4F8',okBg:'C6EFCE',okFg:'006100',badBg:'FFC7CE',badFg:'9C0006'};

  const N=(v,bg,fg)=>({v:typeof v==='number'?v:(parseFloat(v)||0),t:'n',s:mk(bg,fg||C.grey,false,10,'right')});

    [{v:K.pa_lotes+' lotes',t:'s',s:mk(C.light,C.grey,true,18,'center')},null,null,{v:K.inv_lotes+' lotes',t:'s',s:mk(C.light,C.grey,true,18,'center')},null,null,{v:K.corte_lotes+' lotes',t:'s',s:mk(C.light,C.grey,true,18,'center')},null,null],
    [{v:fmtN(K.pa_unidades)+' unidades',t:'s',s:mk(C.light,C.lgrey,false,10,'center')},null,null,{v:fmtN(K.inv_unidades)+' unidades',t:'s',s:mk(C.light,C.lgrey,false,10,'center')},null,null,{v:fmtN(K.corte_unidades)+' unidades',t:'s',s:mk(C.light,C.lgrey,false,10,'center')},null,null],
    Array(9).fill(null),
    [H('A fabricar en MQ'),null,null,H('PP objetivo total',C.lav),null,null,H('No planificadas',C.ok),null,null],
    [{v:K.mq_lotes+' lotes',t:'s',s:mk(C.light,C.grey,true,18,'center')},null,null,{v:K.pp_lotes+' lotes',t:'s',s:mk(C.light,C.grey,true,18,'center')},null,null,{v:K.no_planif+' lotes',t:'s',s:mk(C.light,C.grey,true,18,'center')},null,null],
    [{v:fmtN(K.mq_unidades)+' unidades',t:'s',s:mk(C.light,C.lgrey,false,10,'center')},null,null,{v:'–',t:'s',s:mk(C.light,C.lgrey,false,10,'center')},null,null,{v:K.no_planif>0?'Revisar capacidad':'OK',t:'s',s:mk(C.light,C.lgrey,false,10,'center')},null,null],
    Array(9).fill(null),
    [{v:'Necesidades PA por semana (unidades)',t:'s',s:mk(null,C.purple,true,12)}],
    [H('Semana'),H('Unidades')],
    ...PLANNING.pa_por_semana.map(r=>[D(String(r.semana)),N(r.unidades)]),
    Array(9).fill(null),
    [{v:'Top 10 PP por unidades objetivo',t:'s',s:mk(null,C.purple,true,12)}],
    [H('Ref SE1'),H('Unidades')],
    ...PLANNING.top_pp.map(r=>[D(r.se1),N(r.unidades)]),
    Array(9).fill(null),
    [{v:'Ocupación por MQ (% media de los días planificados)',t:'s',s:mk(null,C.purple,true,12)}],
    [H('MQ'),H('Capacidad/día'),H('Días con uso'),H('Ud planificadas'),H('Ocupación media %')],
    ...PLANNING.ocupacion_mq.map(r=>[D(r.mq),N(r.capacidad),N(r.dias_uso),N(r.ud_total),N(r.ocupacion_pct)])
  ];
  const wsDash=window.XLSX.utils.aoa_to_sheet(dashAOA);
  wsDash['!cols']=[8,12,4,18,12,4,22,12,4].map(w=>({wch:w}));
  wsDash['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}},
    {s:{r:3,c:0},e:{r:3,c:2}},{s:{r:3,c:3},e:{r:3,c:5}},{s:{r:3,c:6},e:{r:3,c:8}},
    {s:{r:4,c:0},e:{r:4,c:2}},{s:{r:4,c:3},e:{r:4,c:5}},{s:{r:4,c:6},e:{r:4,c:8}},
    {s:{r:5,c:0},e:{r:5,c:2}},{s:{r:5,c:3},e:{r:5,c:5}},{s:{r:5,c:6},e:{r:5,c:8}},
    {s:{r:7,c:0},e:{r:7,c:2}},{s:{r:7,c:3},e:{r:7,c:5}},{s:{r:7,c:6},e:{r:7,c:8}},

  ];
  window.XLSX.utils.book_append_sheet(wb,wsDash,'Dashboard');
  /* CORTE_COLAS */
  addSheet('CORTE_COLAS',
    ['Lanzada','Tipo','Ref SE1','Descripción','Ref SE69','Cantidad lote','Fecha corte colas','Origen','Lote PA / Detalle','Semana PA'].map(H),
    r=>[D(''),D(r.tipo),D(r.se1),D(r.descripcion),D(r.se69||''),N(r.qty),D(r.fecha_corte_es),D(r.origen),D(String(r.detalle||'')),N(r.semana_pa)],

  /* PA_FECHAS_ENTREGA */
  addSheet('PA_FECHAS_ENTREGA',
    ['Lote PA','Semana PA','Fecha objetivo (lunes N-3)','Fecha mínima (martes N-2)','Ref SE1','Cantidad','Origen','Fecha entrega balón','Cumple objetivo (N-3)','Cumple mínimo (N)'].map(H),
    r=>[D(String(r.lote_pa)),N(r.semana_pa),D(r.fecha_n3_es),D(r.fecha_min_es),D(r.se1),N(r.qty),D(r.origen),D(r.fecha_entrega_es),SI(r.cumple_obj),SI(r.cumple_min)],
    PLANNING.pa_entrega,[10,10,22,26,10,10,22,18,20,18]);
  /* PA_CUBIERTO_INV */
  addSheet('PA_CUBIERTO_INV',
    ['Lote PA','Semana PA','Ref SE1','Descripción','Cantidad PA','Lote SE1 inventario','Cantidad lote inv','Diferencia (lote - PA)'].map(h=>H(h,C.ok)),
    r=>[D(String(r.lote_pa)),N(r.semana_pa),D(r.se1),D(r.descripcion),N(r.cantidad_pa),D(String(r.lote_inv||'')),N(r.qnt_inv),{v:r.diff??0,t:'n',s:mk(null,r.diff===0?C.ok:C.bad,false,10,'right')}],

  addSheet('NO_ASIGNADO',
    ['Lote PA','Semana PA','Ref SE1','Descripción','Cantidad','Origen','Fecha límite','Fecha entrega','Motivo'].map(h=>H(h,C.bad)),
    r=>[D(String(r.lote_pa)),N(r.semana_pa),D(r.se1),D(r.descripcion),N(r.qty),D(r.origen),D(r.fecha_limite_es||''),D(r.fecha_entrega_es||''),D(r.motivo||'')],
