body{font-family:'Segoe UI','Aptos',Arial,sans-serif;margin:0;background:var(--bg);color:var(--grey)}
header{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}

.pin-btn{background:#fff;color:var(--purple);border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.pin-btn:hover{background:#f0ebff}
.pin-status{font-size:11px;font-weight:700;opacity:.9}
.pin-unlocked .pin-status{color:#86EFAC}
.locked-overlay{pointer-events:none;opacity:.5}

header .sub{opacity:.85;font-size:13px;margin-top:4px}

nav.tabs.tabs-logic{position:sticky;top:0;border-bottom:1px solid #e5dff0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
nav.tabs button{background:#eee;color:var(--grey);border:0;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;font-weight:600}
nav.tabs button:hover{background:var(--lav)}
nav.tabs button.active{background:var(--purple);color:#fff}
main{padding:16px 22px 32px}
.tab-content{display:none;animation:fade .25s ease}
.tab-content.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi h3{margin:0;padding:8px 12px;color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{padding:14px 12px 4px;font-size:24px;font-weight:800}
.kpi .s{padding:0 12px 12px;font-size:12px;color:#777}
.kpi.purple h3{background:var(--purple)}
.kpi.magenta h3{background:var(--magenta)}
.kpi.ok h3{background:var(--ok)}
.kpi.warn h3{background:var(--warn);color:#333}
.kpi.bad h3{background:var(--bad)}
.kpi.lav h3{background:var(--lav);color:var(--purple)}

.panel h2{margin:0 0 10px;font-size:16px;color:var(--purple);border-bottom:1px solid #eee;padding-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.chart-wrap.tall{height:420px}

table.data tr:hover td{background:#fdecf2}
.pct-low{color:var(--bad);font-weight:700}

// Fuerza recarga si el navegador tiene versión en caché más antigua
(function(){
  const TS = '09/07/2026 13:41';
  const KEY = 'balones_last_ts';
  const prev = sessionStorage.getItem(KEY);
  if(prev && prev !== TS){
    sessionStorage.setItem(KEY, TS);
    location.reload(true);
    return;
  }
  sessionStorage.setItem(KEY, TS);
  // Muestra tiempo transcurrido desde generación
  function showAge(){
    const el = document.getElementById('gen-age');
    if(!el) return;
    const parts = TS.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)/);
    if(!parts) return;
    const gen = new Date(+parts[3], +parts[2]-1, +parts[1], +parts[4], +parts[5]);
    const mins = Math.round((Date.now()-gen)/60000);
    if(mins < 2) el.textContent = '(recién generado)';
    else if(mins < 60) el.textContent = '(hace ' + mins + ' min)';
    else el.textContent = '(hace ' + Math.round(mins/60) + 'h)';
  }
  showAge();
  setInterval(showAge, 60000);
})();
</script>

function isoWeekFromISODate(s){
  if(!s) return 0;
  const parts=String(s).split('-');
  if(parts.length<3) return 0;
  const d=new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
  const day=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  const target=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1+Math.round(((d-target)/86400000-3+((target.getUTCDay()+6)%7))/7);
}
function isValidSE69(v){
  // Una Ref SE69 es válida cuando hay realmente un bulk común detrás.
  // Vacío, null, espacios o el placeholder '-' significan "no hay bulk":
  // esas filas NO se agrupan como BULK.
  if(v===null || v===undefined) return false;
  const s = String(v).trim();
  if(!s) return false;
  if(s === '-' || s === '—' || s === '–') return false;
  return true;
}
function bulkKeyMQ(row){
  // BULK real: solo cuando la fila tiene una Ref SE69 válida. Cubre el caso
  // típico "6 órdenes de 30 ud = 1 bulk SE69 de 180 ud". Cuando no hay
  // SE69, las filas se agrupan visualmente con seqKeyMQ (mismo color, sin
  // badge ni vinculación de la casilla Lanzada).
  if(!isValidSE69(row.se69)) return null;
  const wk = isoWeekFromISODate(row.fecha);
  return 'BMQ:'+String(row.se69).trim()+':W'+wk;
}
function seqKeyMQ(row){
  // Agrupación SOLO VISUAL para órdenes consecutivas SIN bulk SE69:
  // misma Ref SE1 fabricada el mismo día en la misma máquina. Se pintan
  // con el mismo color pero NO llevan etiqueta de Bulk y cada línea
  // se marca/desmarca como Lanzada de forma independiente.
  if(isValidSE69(row.se69)) return null;
  if(!row.se1 || !row.fecha) return null;
  return 'SEQ:'+row.se1+':'+row.fecha;
}
function bulkKeyCorte(row){
  // Corte de colas: solo se agrupa como bulk cuando hay Ref SE69 real.
  if(!isValidSE69(row.se69)) return null;
  return 'BC:'+String(row.se69).trim()+':'+(row.fecha_corte||'');
}
function lanzadaStorageGet(key){
  try { return localStorage.getItem(key)==='1'; } catch(e){ return false; }
}
function lanzadaStorageSet(key, v){
  try {
    if(v) localStorage.setItem(key,'1');
    else localStorage.removeItem(key);
  } catch(e){}
}

</style>
<div class="panel">
  <div class="db-pp-wrap">
    <div class="db-pp-title">Stock mínimo (PP) cubierto <span>${ppPct.toFixed(1)}%</span></div>
    <div class="db-pp-outer">
      <div class="db-pp-gradient"></div>
      <div class="db-pp-mask" style="width:${(100-ppPct).toFixed(2)}%"></div>
      <div class="db-pp-label">${fmt(Math.round(ppCob))} ud de ${fmt(Math.round(ppTotal))} ud objetivo</div>
    </div>
    <div class="db-pp-sub">Déficit: ${fmt(Math.round(ppTotal-ppCob))} ud</div>
  </div>

  <div class="db-mq-section">
    <div class="db-mq-title">Capacidad S${st.sem_fab||'—'} por máquina · ${st.dias_fab||'—'} días laborables</div>
    <div class="db-mq-legend">
      <span><i style="background:linear-gradient(to right,#16A34A,#F59E0B,#DC2626)"></i>Backlog S${st.sem_pa_s29||29} · Base S${st.sem_pa_base||30} · Opc S${st.sem_pa_s31||31} · Opc S${st.sem_pa_s35||35} · PP · Stock</span>
      <span style="color:#aaa;font-size:10px">(gradiente claro→oscuro según orden de más a menos unidades)</span>
    </div>
    <div class="db-mq-wrap"><div id="db-mq-bars"></div></div>
  </div>

  <div class="db-summary">
    <div class="db-sum-title">Resumen semana S${st.sem_fab||'—'}</div>
    <div class="db-sum-table" id="db-sum-table"></div>
  </div>
</div>`;

  // ── Barras por máquina ──────────────────────────────────────────────────
  // Gradiente azul claro→oscuro sobre la zona ocupada; segmentos con label encima
  const BLUE_STOPS = ['#BFDBFE','#93C5FD','#60A5FA','#2563EB','#1E40AF'];
  function blueAt(ratio){ // ratio 0-1 dentro del fill → color azul
    const i = Math.min(BLUE_STOPS.length-2, Math.floor(ratio*(BLUE_STOPS.length-1)));
    return BLUE_STOPS[i];
  }
  const SEG_LABELS = {
    pa29:`S${st.sem_pa_s29||29}(bkl)`,
    pa30:`S${st.sem_pa_base||30}(base)`,
    pa31:`S${st.sem_pa_s31||31}(opc)`,
    pa35:`S${st.sem_pa_s35||35}(opc)`,
    pp:'PP', stk:'Stock'
  };
  const barsEl = document.getElementById('db-mq-bars');
  MQS_ORD.forEach(mq => {
    const d = mqData[mq];
    if(!d) return;
    const cap  = d.cap || 1;
    const used = d.total;
    const pct  = Math.min(100, used / cap * 100);
    // Segmentos ordenados de más a menos, solo los que tienen ud > 0
    const segs = [
      {key:'pa29', ud:d.pa29},
      {key:'pa30', ud:d.pa30},
      {key:'pa31', ud:d.pa31},
      {key:'pa35', ud:d.pa35},
      {key:'pp',   ud:d.pp},
      {key:'stk',  ud:d.stk},
    ].filter(s=>s.ud>0).sort((a,b)=>b.ud-a.ud);

    // Para cada segmento calcular % relativo al fill (no a cap)
    // El fill ocupa pct% del outer; cada segmento ocupa ud/used * 100% del fill
    let segHtml = '';
    let cumRatio = 0;
    segs.forEach((s, idx) => {
      const wPct = (s.ud / used * 100).toFixed(3); // % dentro del fill
      const midRatio = cumRatio + s.ud/used/2;
      cumRatio += s.ud/used;
      const label = SEG_LABELS[s.key] || s.key;
      const tooltip = `${label}: ${fmt(Math.round(s.ud))} ud · ${(s.ud/cap*100).toFixed(1)}% cap`;
      segHtml += `<div class="db-mq-seg-inner" style="width:${wPct}%" title="${tooltip}">${label}</div>`;
    });

    const row = document.createElement('div');
    row.className = 'db-mq-row';
    row.innerHTML = `
      <div class="db-mq-name">${mq}</div>
      <div class="db-mq-bar-outer">
        <div class="db-mq-fill" style="width:${pct.toFixed(2)}%;background:linear-gradient(to right,#16A34A 0%,#84CC16 40%,#F59E0B 65%,#DC2626 100%)">
          ${segHtml}
        </div>
      </div>
      <div class="db-mq-pct">${pct.toFixed(0)}%</div>`;
    barsEl.appendChild(row);
  });

  // ── Tabla resumen ───────────────────────────────────────────────────────
  const sumEl = document.getElementById('db-sum-table');
  const row = (label, val, indent, sub) => {
    const lCls = 'db-sum-label'+(indent?' indent':'');
    const vCls = 'db-sum-val'+(sub?' sub':'');
    return `<div class="${lCls}">${label}</div><div class="${vCls}">${fmt(val)} ud</div>`;
  };
  const sep = '<div class="db-sum-sep"></div>';
  const s29 = st.sem_pa_s29||29, s30 = st.sem_pa_base||30, s31 = st.sem_pa_s31||31, s35 = st.sem_pa_s35||35;
  sumEl.innerHTML =
    row('Necesidad PA total (backlog+base+opcionales)', st.pa_total||0)+
    row(`→ Backlog S${s29}`,         st.pa_s29_total||0, true, true)+
    row(`→ Base S${s30}`,            st.pa_s30_total||0, true, true)+
    row(`→ Opcional S${s31}`,        st.pa_s31_total||0, true, true)+
    row(`→ Opcional S${s35}`,        st.pa_s35_total||0, true, true)+
    sep+
    row('Cubierto por inventario y S'+(st.sem_fab-1), st.cob_total||0)+
    row('→ Stock SE1',               st.cob_se1||0, true, true)+
    row('→ Stock SE69',              st.cob_se69||0, true, true)+
    row(`→ S${st.sem_fab-1} en curso`, st.cob_s26||0, true, true)+
    sep+
    row(`Unidades a fabricar S${st.sem_fab||'—'}`, st.fab_total||0)+
    row(`→ Backlog S${s29}`,         st.fab_pa_s29||0, true, true)+
    row(`→ Base S${s30}`,            st.fab_pa_s30||0, true, true)+
    row(`→ Opcional S${s31}`,        st.fab_pa_s31||0, true, true)+
    row(`→ Opcional S${s35}`,        st.fab_pa_s35||0, true, true)+
    row('→ PP (stock mínimo)',        st.fab_pp||0, true, true)+
    row('→ Stock por amortizar tirada', st.fab_stock||0, true, true);
}

  const ppRows  = allRows.filter(r => (r.tipo||'PA') === 'PP');

      '<h2>Cortes para PA — '+paRows.length+' lotes desde stock SE69</h2>'+
      '<p style="margin:0 0 10px;font-size:12px;color:#666">Ordenados de más próximo a más lejano. Los lotes que se fabrican en máquina ya no aparecen aquí.</p>'+
      '<div id="tbl-corte-pa"></div>'+

      '<h2>Cortes para PP — '+ppRows.length+' lotes desde stock SE69</h2>'+
      '<p style="margin:0 0 10px;font-size:12px;color:#666">Completar stock mínimo PP cortando de bulk SE69 existente.</p>'+

  buildTable(document.getElementById('tbl-corte-pa'), cols, paRows, opts);

function buildTable(container, cols, rows, opts){
  opts = opts || {};
  const bulkKeyFn = opts.bulkKeyFn || null;
  const seqKeyFn  = opts.seqKeyFn  || null;  // agrupación sólo VISUAL (sin badge ni checkbox enlazado)
  const lanzadaKey = opts.lanzadaKey || null;
  const rowIdFn   = opts.rowIdFn   || null;
  const BULK_CAP  = opts.bulkCap || 180;

  const wrap=document.createElement('div'); wrap.className='table-wrap';
  const tbl=document.createElement('table'); tbl.className='data';
  const thead=document.createElement('thead');
  const trH=document.createElement('tr');
  cols.forEach((c,idx)=>{
    const th=document.createElement('th');
    if(c.lanzada){
      th.innerHTML='✓ '+c.t;
      th.style.minWidth='80px';
      th.style.textAlign='center';
      th.style.cursor='default';
    } else {
      th.innerHTML=c.t+' <span style="font-size:10px;opacity:.7">&#x21C5;</span>';
      th.dataset.col=idx;
      th.addEventListener('click', ()=>sortBy(idx));
    }
    trH.appendChild(th);
  });
  thead.appendChild(trH);
  const trF=document.createElement('tr'); trF.className='filter';
  cols.forEach((c,idx)=>{
    const th=document.createElement('th');
    if(!c.lanzada){
      const inp=document.createElement('input'); inp.placeholder='filtrar...'; inp.dataset.col=idx;
      inp.addEventListener('input', applyFilters); th.appendChild(inp);
    }
    trF.appendChild(th);
  });
  thead.appendChild(trF);
  tbl.appendChild(thead);
  const tbody=document.createElement('tbody'); tbl.appendChild(tbody);

  // === Pre-cálculo de grupos bulk con tope de BULK_CAP unidades ===
  // Para cada fila asignamos su "effective bulkKey" = baseKey + '#' + subIdx,
  // de modo que un grupo lógico se parte en subgrupos cada vez que su suma
  // acumulada superaría BULK_CAP. Así nunca aparece un sombreado > 180 ud.
  const rowEffKey = new Map();
  const groupColor = {};
  const groupTotal = {};
  const groupSize  = {};
  const groupMembers = {};
  if(bulkKeyFn){
    const subIdx = {};
    const subTot = {};
    rows.forEach(r=>{
      const base = bulkKeyFn(r);
      if(!base) return;
      const qty = Number(r.qty)||0;
      if(!(base in subIdx)) subIdx[base] = 0;
      let idx = subIdx[base];
      let curKey = base+'#'+idx;
      let curTot = subTot[curKey]||0;
      if(curTot > 0 && curTot + qty > BULK_CAP){
        idx += 1;
        subIdx[base] = idx;
        curKey = base+'#'+idx;
        curTot = 0;
      }
      subTot[curKey] = curTot + qty;
      rowEffKey.set(r, curKey);
      groupSize[curKey] = (groupSize[curKey]||0) + 1;
      groupTotal[curKey] = (groupTotal[curKey]||0) + qty;
      if(!groupMembers[curKey]) groupMembers[curKey] = [];
      groupMembers[curKey].push(r);
    });
    let cidx = 0;
    rows.forEach(r=>{
      const k = rowEffKey.get(r);
      if(!k || groupColor[k] || (groupSize[k]||0) < 2) return;
      groupColor[k] = 'bulk-c' + ((cidx % 12) + 1);
      cidx++;
    });
  }
  function effBulkKey(r){ return rowEffKey.get(r) || null; }

  // === Pre-cálculo de grupos SECUENCIALES (sólo color visual) ===
  // No tienen bulk SE69, pero comparten SE1 y día de fabricación: se ejecutan
  // de forma consecutiva en la máquina. Las pintamos del mismo color para
  // mostrar esa continuidad, pero SIN etiqueta "Bulk X ud" y SIN enlazar
  // las casillas "Lanzada" (cada órden se lanza por separado).
  const rowSeqKey = new Map();
  const seqColor = {};
  const seqSize  = {};
  if(seqKeyFn){
    rows.forEach(r=>{
      const k = seqKeyFn(r);
      if(!k) return;
      rowSeqKey.set(r, k);
      seqSize[k] = (seqSize[k]||0) + 1;
    });
    let sidx = 0;
    rows.forEach(r=>{
      const k = rowSeqKey.get(r);
      if(!k || seqColor[k] || (seqSize[k]||0) < 2) return;
      // Paleta desplazada (empezamos por c7) para distinguir visualmente
      // de los grupos BULK reales.
      seqColor[k] = 'bulk-c' + (((sidx + 6) % 12) + 1);
      sidx++;
    });
  }
  function effSeqKey(r){ return rowSeqKey.get(r) || null; }

  function rowLanzadaKey(r){
    if(!lanzadaKey || !rowIdFn) return null;
    const id = rowIdFn(r); if(!id) return null;
    return lanzadaKey+':'+id;
  }
  function isLanzada(r){
    const k = rowLanzadaKey(r);
    return k ? lanzadaStorageGet(k) : false;
  }
  function setLanzadaForRow(r, v){
    // Si la fila pertenece a un grupo bulk, marcar/desmarcar TODAS las del grupo.
    const ek = effBulkKey(r);
    const targets = (ek && groupMembers[ek] && groupMembers[ek].length>1) ? groupMembers[ek] : [r];
    targets.forEach(rr=>{
      const k = rowLanzadaKey(rr);
      if(k) lanzadaStorageSet(k, v);
    });
  }

  let state={sortIdx:-1, asc:true, filters:{}};
  function rowMatches(r){
    for(const idx in state.filters){
      const f=state.filters[idx]; if(!f) continue;
      const c=cols[idx];
      let raw;
      if(c.lanzada) raw = isLanzada(r) ? 'si lanzada' : 'no pendiente';
      else raw = r[c.k];
      const v=(raw===null||raw===undefined?'':String(raw)).toLowerCase();
      if(!v.includes(f)) return false;
    }
    return true;
  }
  function paint(){
    let arr=rows.filter(rowMatches);
    if(state.sortIdx>=0){
      const c=cols[state.sortIdx]; const key=c.sortBy||c.k;
      arr=arr.slice().sort((a,b)=>{
        let va=a[key], vb=b[key];
        if(c.n){va=Number(va)||0; vb=Number(vb)||0;}
        else {va=String(va||'').toLowerCase(); vb=String(vb||'').toLowerCase();}
        if(va<vb) return state.asc?-1:1;
        if(va>vb) return state.asc?1:-1;
        return 0;
      });
    }
    tbody.innerHTML='';
    const frag=document.createDocumentFragment();
    let lanzadasCount = 0;
    // Mostrar el badge "Bulk X ud" al inicio de CADA bloque visual contiguo
    // del mismo grupo, no solo la primera aparición global. Si el grupo está
    // partido por filas intermedias de otros SE69, cada tramo lleva su propio badge.
    let prevBkey = null;
    arr.forEach(r=>{
      const tr=document.createElement('tr');
      let bkey=null, bclass=null, showBadge=false;
      if(bulkKeyFn){
        bkey = effBulkKey(r);
        if(bkey && groupColor[bkey]){
          bclass = groupColor[bkey];
          if(bkey !== prevBkey){ showBadge=true; }
        }
      }
      // Si no hay BULK real, intentamos colorear como grupo secuencial.
      if(!bclass && seqKeyFn){
        const sk = effSeqKey(r);
        if(sk && seqColor[sk]) bclass = seqColor[sk];
      }
      prevBkey = bkey;
      const lanz = isLanzada(r);
      if(lanz) lanzadasCount++;
      const classes=[];
      if(bclass) classes.push(bclass);
      if(lanz) classes.push('lanzada-row');
      if(classes.length) tr.className = classes.join(' ');
      if(r.pl_se_nivel===2) tr.classList.add('plse-2');
      else if(r.pl_se_nivel===3) tr.classList.add('plse-3');
      cols.forEach(c=>{
        const td=document.createElement('td');
        if(c.lanzada){
          const cb=document.createElement('input');
          cb.type='checkbox';
          cb.className='lanzada-cb';
          cb.checked = lanz;
          const ek_cb = effBulkKey(r);
          const linked = !!(ek_cb && groupMembers[ek_cb] && groupMembers[ek_cb].length>1);
          cb.title = linked
            ? 'Marcar la orden como LANZADA (se guarda en este navegador). Esta fila pertenece a un BULK SE69, así que al marcarla se marcan también el resto de filas del grupo.'
            : 'Marcar la orden como LANZADA (se guarda en este navegador). Cada órden se lanza por separado.';
          cb.addEventListener('change', ()=>{
            setLanzadaForRow(r, cb.checked);
            paint();
          });
          td.appendChild(cb);
          td.style.textAlign='center';
        } else {
          const raw=r[c.k];
          if(c.render) td.innerHTML=c.render(raw, r);
          else if(c.n){td.textContent=fmt(raw); td.style.textAlign='right';}
          else td.textContent=raw===null||raw===undefined?'':String(raw);
          if(c.k==='qty' && showBadge){
            const dot='<span class="bulk-dot" style="background:'+bulkDotColor(bclass)+'"></span>';
            const inner = td.innerHTML;
            // Badge a la IZQUIERDA del qty para que el número quede alineado a la derecha igual que el resto de filas del grupo.
            td.innerHTML = '<span class="bulk-total" title="Bulk SE69 — suma total del grupo sombreado (máx '+BULK_CAP+' ud)">Bulk '+FMT.format(groupTotal[bkey])+' ud</span> ' + dot + inner;
            td.style.textAlign='right';
          }
        }
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    let txt = arr.length+' filas';
    if(lanzadaKey) txt += ' · ✓ '+lanzadasCount+' lanzadas';
    countText.textContent = txt;
  }
  function applyFilters(e){
    const idx=e.target.dataset.col; const v=e.target.value.trim().toLowerCase();
    if(v) state.filters[idx]=v; else delete state.filters[idx];
    paint();
  }
  function sortBy(idx){
    if(cols[idx] && cols[idx].lanzada) return;
    if(state.sortIdx===idx) state.asc=!state.asc;
    else {state.sortIdx=idx; state.asc=true;}
    paint();
  }
  function bulkDotColor(cls){
    const M={'bulk-c1':'#F9A825','bulk-c2':'#00897B','bulk-c3':'#D81B60','bulk-c4':'#3949AB',
             'bulk-c5':'#E64A19','bulk-c6':'#7CB342','bulk-c7':'#5E35B1','bulk-c8':'#C0CA33',
             'bulk-c9':'#039BE5','bulk-c10':'#E53935','bulk-c11':'#6D4C41','bulk-c12':'#546E7A'};
    return M[cls]||'#999';
  }
  const countEl=document.createElement('div');
  countEl.style.cssText='font-size:12px;color:#666;margin-top:6px;display:flex;align-items:center;gap:10px;';
  const countText=document.createElement('span');
  countEl.appendChild(countText);
  if(lanzadaKey){
    const btn=document.createElement('button');
    btn.className='lanzada-clear';
    btn.textContent='Limpiar lanzadas';
    btn.title='Desmarca todas las casillas Lanzada de esta tabla';
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Desmarcar todas las casillas Lanzada de esta tabla?')) return;
      rows.forEach(r=>{ const k = rowLanzadaKey(r); if(k) lanzadaStorageSet(k, false); });
      paint();
    });
    countEl.appendChild(btn);
  }
  wrap.appendChild(tbl);
  container.appendChild(wrap);
  container.appendChild(countEl);
  paint();
}

function exportarExcel(){
  if(!window.XLSX){alert('Librería de exportación no disponible. Comprueba la conexión a internet.');return;}
  const wb=window.XLSX.utils.book_new();
  const PURP='5B2C7A', BLANC='FFFFFF', GRIS='E8E8E8', TXT='2E2E2E';
  const mkH=()=>({font:{bold:true,color:{rgb:BLANC},sz:10,name:'Segoe UI'},
    fill:{patternType:'solid',fgColor:{rgb:PURP}},
    alignment:{horizontal:'center',vertical:'center'}});
  const mkD=(bg,right)=>({font:{bold:false,color:{rgb:TXT},sz:10,name:'Segoe UI'},
    fill:{patternType:'solid',fgColor:{rgb:bg}},
    alignment:{horizontal:right?'right':'left',vertical:'center'}});
  const H=v=>({v,t:'s',s:mkH()});
  const D=(v,bg)=>({v:v??'',t:'s',s:mkD(bg,false)});
  const N=(v,bg)=>({v:typeof v==='number'?v:(parseFloat(v)||0),t:'n',s:mkD(bg,true)});
  const psk={};
  const allFabWeeks=Object.keys(psk).map(Number).sort((a,b)=>a-b);
  const hdr=[H('Referencia'),H('Descripción'),H('Sem. fab.'),H('Cantidad'),H('Destino'),H('Semana PA'),H('Ref. bulk')];
  const mkSep=(fw,bg)=>({v:'── FAB S'+fw+' ──',t:'s',s:{font:{bold:true,color:{rgb:'5B2C7A'},sz:10,name:'Segoe UI'},fill:{patternType:'solid',fgColor:{rgb:'EDE9F6'}},alignment:{horizontal:'left'}}});
  PLANNING.orden_mq.forEach(mq=>{
    const dataRows=[];
    let ci=0;
    let lastFw=null;
    allFabWeeks.forEach(fw=>{
      const rows=(psk[String(fw)]||{})[mq]||[];
      if(!rows.length)return;
      // Separador de semana
      if(lastFw!==fw){
        const sepBg='EDE9F6';
        dataRows.push([mkSep(fw),D('',sepBg),D('',sepBg),D('',sepBg),D('',sepBg),D('',sepBg),D('',sepBg)]);
        lastFw=fw;
      }
      rows.forEach(r=>{
        const bg=ci%2===0?BLANC:GRIS;
        const sfab=r.semana_fab||fw;
        const is4wj=(mq==='4WJ');
        const refDisp=is4wj?(r.se69||r.se1):r.se1;
        if(is4wj){
          // 4WJ: siempre una fila de 180ud, ref = SE69
          if(r.origen==='SE69'){
            dataRows.push([D(refDisp,bg),D(r.descripcion||'',bg),N(sfab,bg),N(180,bg),D('SE69',bg),D('',bg),D(r.se69||'',bg)]);
          } else {
            // PA run: fila de 180, ref SE69, sin desglose en Excel
            dataRows.push([D(refDisp,bg),D(r.descripcion||'',bg),N(sfab,bg),N(180,bg),D('PA',bg),N(r.semana_pa||0,bg),D('',bg)]);
          }
        } else if(r.origen==='PA'&&r.rows_detalle&&r.rows_detalle.length){
          r.rows_detalle.forEach(det=>{
            dataRows.push([D(r.se1||'',bg),D(r.descripcion||'',bg),N(sfab,bg),N(det.peces||0,bg),D('PA',bg),N(det.sem_pa||0,bg),D('',bg)]);
          });
          if((r.run_se1_pp||0)>0){
            dataRows.push([D(r.se1||'',bg),D(r.descripcion||'',bg),N(sfab,bg),N(r.run_se1_pp,bg),D('PP',bg),D('',bg),D('',bg)]);
          }
        } else if(r.origen==='PP'&&r.pp_desglose){
          Object.entries(r.pp_desglose).sort(([a],[b])=>Number(b)-Number(a)).forEach(([sz,n])=>{
            const size=parseInt(sz);
            for(let i=0;i<n;i++) dataRows.push([D(r.se1||'',bg),D(r.descripcion||'',bg),N(sfab,bg),N(size,bg),D('PP',bg),D('',bg),D('',bg)]);
          });
        } else {
          const semPa=(r.origen==='PA'&&r.semana_pa>0)?r.semana_pa:null;
          dataRows.push([D(r.se1||'',bg),D(r.descripcion||'',bg),N(sfab,bg),N(r.qty_total||r.qty||0,bg),D(r.origen||'',bg),semPa!=null?N(semPa,bg):D('',bg),D('',bg)]);
        }
        ci++;
      });
    });
    if(!dataRows.length)return;
    const ws=window.XLSX.utils.aoa_to_sheet([hdr,...dataRows]);
    ws['!cols']=[{wch:14},{wch:32},{wch:11},{wch:10},{wch:9},{wch:11},{wch:12}];
    window.XLSX.utils.book_append_sheet(wb,ws,mq);
  });
  /* DOWNLOAD */
  const sem=allFabWeeks[0]||27;
  const ts=PLANNING.generado.replace(/\//g,'').replace(/ /,'_').replace(/:/g,'');
  window.XLSX.writeFile(wb,'PlanS'+sem+'_'+ts+'.xlsx');
}

// ── KANBAN ────────────────────────────────────────────────────────────────────
(function(){
  const tip=document.createElement('div'); tip.className='kn-tooltip'; document.body.appendChild(tip);
  document.addEventListener('mousemove',e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; });
  window._knShowTip=function(item){
    const lines=[];
    lines.push('<span class="kn-tt-lbl">'+item.ref+'</span>'+(item.descripcion?' — <span style="color:#ccc;font-size:10px">'+item.descripcion+'</span>':''));
    // Destino único (tarjetas S28 del Excel operarios)
    if(item.destino && !item.detalle){
      lines.push('<span class="kn-tt-lbl">Destino:</span> <span class="kn-tt-dest">'+item.destino+'</span>');
      lines.push('<span class="kn-tt-lbl">Qty:</span> <b>'+(item.qty||item.uds||0)+' ud</b>');
    }
    // Detalle lote a lote
    if(item.detalle && item.detalle.length){
      lines.push('<span style="color:#aaa;font-size:9.5px;border-top:1px solid #444;display:block;padding-top:4px;margin-top:2px">Lotes:</span>');
      item.detalle.forEach(function(lot){
        const tag = lot.lote_pa==='PP' ? '<span style="color:#f9a825;font-weight:700">PP</span>' : (lot.sem_pa?'<span class="kn-sem" style="font-size:9px">PA S'+lot.sem_pa+'</span>':'');
        const dest = lot.destino ? ' → <span class="kn-tt-dest">'+lot.destino+'</span>' : '';
        lines.push('<span style="display:flex;gap:5px;align-items:center"><b>'+lot.qty+' ud</b> '+tag+dest+'</span>');
      });
      const total=item.qty||item.uds||0;
      if(item.qty_pp) lines.push('<span style="color:#aaa;font-size:9.5px">Total: <b>'+total+' ud</b> (incl. PP)</span>');
    }
    tip.innerHTML=lines.map(l=>'<div class="kn-tt-row">'+l+'</div>').join('');
    tip.style.display='block';
  };
  window._knHideTip=function(){ tip.style.display='none'; };
})();

function _makeKanbanCard(item, origen){
  const card = document.createElement('div');
  card.className = 'kn-card';
  card.dataset.origen = origen || 'PA';

  const l1 = document.createElement('div'); l1.className = 'kn-l1';
  const ref = document.createElement('span'); ref.className = 'kn-ref'; ref.textContent = item.ref;
  l1.appendChild(ref);
  if(item.comanda){ const c=document.createElement('span'); c.className='kn-com'; c.textContent='C'; l1.appendChild(c); }
  card.appendChild(l1);

  if(item.descripcion){
    const l2=document.createElement('div'); l2.className='kn-l2';
    const d=document.createElement('span'); d.className='kn-desc'; d.textContent=item.descripcion;
    l2.appendChild(d); card.appendChild(l2);
  }

  const l3=document.createElement('div'); l3.className='kn-l3';
  const qty=document.createElement('span'); qty.className='kn-qty';
  qty.textContent=fmt(item.qty||item.uds||0)+' ud'; l3.appendChild(qty);
  const sems = item.sems || (item.sem_pa ? [item.sem_pa] : []);
  sems.forEach(s=>{ const sp=document.createElement('span'); sp.className='kn-sem'; sp.textContent='PA S'+s; l3.appendChild(sp); });
  card.appendChild(l3);
  card.style.cursor='default';
  card.addEventListener('mouseenter',()=>window._knShowTip(item));
  card.addEventListener('mouseleave',()=>window._knHideTip());
  return card;
}

function renderKanban(sec){
  const kd = PLANNING.kanban;
  if(!kd){ sec.innerHTML='<p style="padding:16px;color:#888">Sin datos de planificación semanal.</p>'; return; }

  const mqs = PLANNING.orden_mq || [];
  const semS28 = kd.sem_s28;
  const semS29 = kd.sem_s29;

  const wrap = document.createElement('div'); wrap.className='panel kn-wrap'; sec.appendChild(wrap);
  const tbl = document.createElement('table'); tbl.className='kn-table'; wrap.appendChild(tbl);

  // Header
  const thead=document.createElement('thead');
  const hrow=document.createElement('tr');
  const thSem=document.createElement('th'); thSem.className='kn-th-sem'; hrow.appendChild(thSem);
  mqs.forEach(mq=>{ const th=document.createElement('th'); th.textContent='MQ '+mq; hrow.appendChild(th); });
  thead.appendChild(hrow); tbl.appendChild(thead);

  const tbody=document.createElement('tbody');

  // Fila S28
  function makeWeekRow(semLabel, mqData, capData){
    const tr=document.createElement('tr');
    const tdSem=document.createElement('td'); tdSem.className='kn-td-sem'; tdSem.textContent='S'+semLabel; tr.appendChild(tdSem);
    mqs.forEach(mq=>{
      const td=document.createElement('td'); td.className='kn-cell';
      const cards = mqData[mq]||[];
      const cap = (capData||{})[mq]||0;
      const used = cards.reduce((s,c)=>s+(c.qty||c.uds||0),0);
      // Barra de ocupación
      const barWrap=document.createElement('div');
      barWrap.style.cssText='position:relative;height:16px;border-radius:4px;overflow:hidden;margin-bottom:4px;background:#6b6b6b';
      if(cap>0){
        const pct=Math.min(100,Math.round(used/cap*100));
        const fill=document.createElement('div');
        fill.style.cssText='position:absolute;top:0;left:0;height:100%;background:#dc2626;border-radius:4px 0 0 4px;width:'+pct+'%';
        barWrap.appendChild(fill);
        const lbl=document.createElement('div');
        lbl.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.5)';
        lbl.textContent=pct+'%';
        barWrap.appendChild(lbl);
      }
      td.appendChild(barWrap);
      cards.forEach(item=>td.appendChild(_makeKanbanCard(item,'PA')));
      tr.appendChild(td);
    });
    return tr;
  }
  tbody.appendChild(makeWeekRow(semS28, kd.s28||{}, kd.cap_s28));

  // Cajetilla pendientes
  const pendientes = kd.pendientes || [];
  if(pendientes.length > 0){
    const trBox=document.createElement('tr');
    const tdBox=document.createElement('td'); tdBox.className='kn-td-full'; tdBox.colSpan=mqs.length+1;
    const box=document.createElement('div'); box.className='kn-pending-box';
    const totalUds=pendientes.reduce((s,r)=>s+(r.uds||0),0);
    const title=document.createElement('div'); title.className='kn-pb-title';
    title.innerHTML='⚠ Refs fuera de planning BALONES &nbsp;<span style="font-weight:400;color:#888;font-size:11px">'+pendientes.length+' refs · '+fmt(totalUds)+' ud</span>';
    box.appendChild(title);
    const cards=document.createElement('div'); cards.className='kn-pb-cards';
    pendientes.forEach(item=>cards.appendChild(_makeKanbanCard(item,'PENDIENTE')));
    box.appendChild(cards); tdBox.appendChild(box); trBox.appendChild(tdBox); tbody.appendChild(trBox);
  }

  // Fila S29
  tbody.appendChild(makeWeekRow(semS29, kd.s29||{}, kd.cap_s29));

  tbl.appendChild(tbody);
}
</script>
