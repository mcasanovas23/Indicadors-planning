<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Planificación SE1 — Balones</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--magenta:#C8246C;--purple:#5B2C7A;--pink:#F4C7DA;--lav:#D9C7E5;--grey:#2E2E2E;--ok:#70AD47;--warn:#FFC000;--bad:#C00000;--bg:#f5f3f9;}
*{box-sizing:border-box}
body{font-family:'Segoe UI','Aptos',Arial,sans-serif;margin:0;background:var(--bg);color:var(--grey)}
header{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff;padding:16px 26px}
header h1{margin:0;font-size:22px}
header .sub{opacity:.85;font-size:13px;margin-top:4px}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;background:#fff;z-index:50}
nav.tabs.tabs-logic{position:sticky;top:0;border-bottom:1px solid #e5dff0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
nav.tabs.tabs-mq{position:sticky;top:46px;background:#f7f3fb;border-bottom:2px solid var(--purple);box-shadow:0 2px 6px rgba(0,0,0,.05);padding:4px 12px;gap:3px}
nav.tabs button{background:#eee;color:var(--grey);border:0;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;font-weight:600}
nav.tabs.tabs-mq button{background:#e5dff0;color:var(--purple);padding:5px 10px;font-size:12px;border-radius:4px 4px 0 0}
nav.tabs button:hover{background:var(--lav)}
nav.tabs button.active{background:var(--purple);color:#fff}
nav.tabs.tabs-mq button.active{background:var(--magenta);color:#fff}
main{padding:16px 22px 32px}
.tab-content{display:none;animation:fade .25s ease}
.tab-content.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi h3{margin:0;padding:8px 12px;color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{padding:14px 12px 4px;font-size:24px;font-weight:800}
.kpi .s{padding:0 12px 12px;font-size:12px;color:#777}
.kpi.purple h3{background:var(--purple)}
.kpi.magenta h3{background:var(--magenta)}
.kpi.ok h3{background:var(--ok)}
.kpi.warn h3{background:var(--warn);color:#333}
.kpi.bad h3{background:var(--bad)}
.kpi.lav h3{background:var(--lav);color:var(--purple)}
.panel{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:16px;color:var(--purple);border-bottom:1px solid #eee;padding-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.row2{grid-template-columns:1fr}}
.chart-wrap{position:relative;height:340px}
.chart-wrap.tall{height:420px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.data thead{position:sticky;top:0;z-index:3}
table.data th{background:var(--purple);color:#fff;padding:6px 8px;text-align:left;cursor:pointer;user-select:none;position:sticky;top:0;z-index:3;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.08)}
table.data th:hover{background:var(--magenta)}
table.data tr.filter th{background:var(--magenta);padding:3px;position:sticky;top:32px;z-index:2}
table.data tr.filter th input{width:100%;padding:4px 6px;border:0;border-radius:3px;font-size:12px}
table.data td{padding:5px 8px;border-bottom:1px solid #eee}
table.data tr:nth-child(even) td{background:#faf8fc}
table.data tr:hover td{background:#fdecf2}
.pct-low{color:var(--bad);font-weight:700}
.pct-mid{color:var(--magenta);font-weight:700}
.pct-high{color:var(--ok);font-weight:700}
.table-wrap{max-height:65vh;overflow:auto;border:1px solid #eee;border-radius:6px}
.toolbar{display:flex;gap:10px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.toolbar .count{font-size:12px;color:#666}
.toolbar .cap-info{font-size:13px;color:var(--purple);font-weight:600}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.PA{background:#dcd0e5;color:var(--purple)}
.badge.PP{background:#fad6e3;color:var(--magenta)}
.badge.EXTRA-PP{background:#ffe6b3;color:#8a5a00}
.cumple-si{background:#C6EFCE;color:#006100;padding:2px 8px;border-radius:8px;font-weight:700;font-size:11px}
.cumple-no{background:#FFC7CE;color:#9C0006;padding:2px 8px;border-radius:8px;font-weight:700;font-size:11px}
/* Sombreado por bulk SE69 / lote PA — paleta de 12 colores suaves */
table.data tr.bulk-c1 td{background:#FFE082 !important}
table.data tr.bulk-c2 td{background:#B2DFDB !important}
table.data tr.bulk-c3 td{background:#F8BBD0 !important}
table.data tr.bulk-c4 td{background:#C5CAE9 !important}
table.data tr.bulk-c5 td{background:#FFCCBC !important}
table.data tr.bulk-c6 td{background:#DCEDC8 !important}
table.data tr.bulk-c7 td{background:#D1C4E9 !important}
table.data tr.bulk-c8 td{background:#FFF9C4 !important}
table.data tr.bulk-c9 td{background:#B3E5FC !important}
table.data tr.bulk-c10 td{background:#FFCDD2 !important}
table.data tr.bulk-c11 td{background:#D7CCC8 !important}
table.data tr.bulk-c12 td{background:#CFD8DC !important}
table.data tr.lanzada-row td{opacity:.55;text-decoration:line-through}
table.data tr.lanzada-row td input.lanzada-cb{opacity:1 !important;text-decoration:none}
.bulk-total{display:inline-block;margin-left:6px;padding:1px 7px;background:rgba(40,30,80,.85);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:.3px;vertical-align:middle;white-space:nowrap}
.bulk-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid rgba(0,0,0,.18)}
input.lanzada-cb{cursor:pointer;width:17px;height:17px;accent-color:#70AD47;vertical-align:middle}
.lanzada-clear{margin-left:auto;background:#eee;border:1px solid #ccc;color:#444;font-size:12px;padding:4px 10px;border-radius:5px;cursor:pointer}
.lanzada-clear:hover{background:#fdecf2;border-color:#C8246C;color:#C8246C}
.lanzada-stats{font-size:12px;color:var(--purple);font-weight:600;margin-left:8px}
</style>
</head>

function isoWeekFromISODate(s){
  if(!s) return 0;
  const parts=String(s).split('-');
  if(parts.length<3) return 0;
  const d=new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
  const day=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  const target=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1+Math.round(((d-target)/86400000-3+((target.getUTCDay()+6)%7))/7);
}
function isValidSE69(v){
  // Una Ref SE69 es válida cuando hay realmente un bulk común detrás.
  // Vacío, null, espacios o el placeholder '-' significan "no hay bulk":
  // esas filas NO se agrupan como BULK.
  if(v===null || v===undefined) return false;
  const s = String(v).trim();
  if(!s) return false;
  if(s === '-' || s === '—' || s === '–') return false;
  return true;
}
function bulkKeyMQ(row){
  // BULK real: solo cuando la fila tiene una Ref SE69 válida. Cubre el caso
  // típico "6 órdenes de 30 ud = 1 bulk SE69 de 180 ud". Cuando no hay
  // SE69, las filas se agrupan visualmente con seqKeyMQ (mismo color, sin
  // badge ni vinculación de la casilla Lanzada).
  if(!isValidSE69(row.se69)) return null;
  const wk = isoWeekFromISODate(row.fecha);
  return 'BMQ:'+String(row.se69).trim()+':W'+wk;
}
function seqKeyMQ(row){
  // Agrupación SOLO VISUAL para órdenes consecutivas SIN bulk SE69:
  // misma Ref SE1 fabricada el mismo día en la misma máquina. Se pintan
  // con el mismo color pero NO llevan etiqueta de Bulk y cada línea
  // se marca/desmarca como Lanzada de forma independiente.
  if(isValidSE69(row.se69)) return null;
  if(!row.se1 || !row.fecha) return null;
  return 'SEQ:'+row.se1+':'+row.fecha;
}
function bulkKeyCorte(row){
  // Corte de colas: solo se agrupa como bulk cuando hay Ref SE69 real.
  if(!isValidSE69(row.se69)) return null;
  return 'BC:'+String(row.se69).trim()+':'+(row.fecha_corte||'');
}
function lanzadaStorageGet(key){
  try { return localStorage.getItem(key)==='1'; } catch(e){ return false; }
}
function lanzadaStorageSet(key, v){
  try {
    if(v) localStorage.setItem(key,'1');
    else localStorage.removeItem(key);
  } catch(e){}
}

       {k:'tipo',t:'Tipo', render:(v,r)=>{ const t=v||'PA'; const cls=(t==='PA'||t==='PP'||t==='EXTRA-PP')?t:'PA'; return '<span class="badge '+cls+'">'+t+'</span>'; }},
       {k:'se1',t:'Ref SE1'},{k:'descripcion',t:'Descripción'},{k:'se69',t:'Ref SE69'},
       {k:'qty',t:'Cantidad lote',n:true},{k:'fecha_corte_es',t:'Fecha corte colas',sortBy:'fecha_corte'},
       {k:'origen',t:'Origen'},{k:'detalle',t:'Lote PA / Detalle'},{k:'semana_pa',t:'Semana PA'}],
      rows,
      {
        bulkKeyFn: bulkKeyCorte,
        lanzadaKey: 'lanz:corte:'+keySuffix,
        rowIdFn: r => (r.se1||'')+'|'+(r.fecha_corte||'')+'|'+(r.detalle||'')+'|'+(r.qty||0)+'|'+(r.origen||'')
      });
  }
  mqArr.forEach(m=>{
    const b=document.createElement('button');
    b.textContent=m;
    b.style.cssText='background:#eee;border:1px solid #ccc;color:#333;padding:4px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600';
    if(m===activeFilter){ b.style.background='var(--magenta)'; b.style.color='#fff'; b.style.borderColor='var(--magenta)'; }
    b.addEventListener('click', ()=>{
      activeFilter = m;
      Object.keys(filterButtons).forEach(k=>{
        const bb=filterButtons[k];
        if(k===activeFilter){ bb.style.background='var(--magenta)'; bb.style.color='#fff'; bb.style.borderColor='var(--magenta)'; }
        else { bb.style.background='#eee'; bb.style.color='#333'; bb.style.borderColor='#ccc'; }
      });
      paintCorteTable();
    });
    filterButtons[m]=b;
    filterDiv.appendChild(b);
  });
  paintCorteTable();
}

function buildTable(container, cols, rows, opts){
  opts = opts || {};
  const bulkKeyFn = opts.bulkKeyFn || null;
  const seqKeyFn  = opts.seqKeyFn  || null;  // agrupación sólo VISUAL (sin badge ni checkbox enlazado)
  const lanzadaKey = opts.lanzadaKey || null;
  const rowIdFn   = opts.rowIdFn   || null;
  const BULK_CAP  = opts.bulkCap || 180;

  const wrap=document.createElement('div'); wrap.className='table-wrap';
  const tbl=document.createElement('table'); tbl.className='data';
  const thead=document.createElement('thead');
  const trH=document.createElement('tr');
  cols.forEach((c,idx)=>{
    const th=document.createElement('th');
    if(c.lanzada){
      th.innerHTML='✓ '+c.t;
      th.style.minWidth='80px';
      th.style.textAlign='center';
      th.style.cursor='default';
    } else {
      th.innerHTML=c.t+' <span style="font-size:10px;opacity:.7">&#x21C5;</span>';
      th.dataset.col=idx;
      th.addEventListener('click', ()=>sortBy(idx));
    }
    trH.appendChild(th);
  });
  thead.appendChild(trH);
  const trF=document.createElement('tr'); trF.className='filter';
  cols.forEach((c,idx)=>{
    const th=document.createElement('th');
    if(!c.lanzada){
      const inp=document.createElement('input'); inp.placeholder='filtrar...'; inp.dataset.col=idx;
      inp.addEventListener('input', applyFilters); th.appendChild(inp);
    }
    trF.appendChild(th);
  });
  thead.appendChild(trF);
  tbl.appendChild(thead);
  const tbody=document.createElement('tbody'); tbl.appendChild(tbody);

  // === Pre-cálculo de grupos bulk con tope de BULK_CAP unidades ===
  // Para cada fila asignamos su "effective bulkKey" = baseKey + '#' + subIdx,
  // de modo que un grupo lógico se parte en subgrupos cada vez que su suma
  // acumulada superaría BULK_CAP. Así nunca aparece un sombreado > 180 ud.
  const rowEffKey = new Map();
  const groupColor = {};
  const groupTotal = {};
  const groupSize  = {};
  const groupMembers = {};
  if(bulkKeyFn){
    const subIdx = {};
    const subTot = {};
    rows.forEach(r=>{
      const base = bulkKeyFn(r);
      if(!base) return;
      const qty = Number(r.qty)||0;
      if(!(base in subIdx)) subIdx[base] = 0;
      let idx = subIdx[base];
      let curKey = base+'#'+idx;
      let curTot = subTot[curKey]||0;
      if(curTot > 0 && curTot + qty > BULK_CAP){
        idx += 1;
        subIdx[base] = idx;
        curKey = base+'#'+idx;
        curTot = 0;
      }
      subTot[curKey] = curTot + qty;
      rowEffKey.set(r, curKey);
      groupSize[curKey] = (groupSize[curKey]||0) + 1;
      groupTotal[curKey] = (groupTotal[curKey]||0) + qty;
      if(!groupMembers[curKey]) groupMembers[curKey] = [];
      groupMembers[curKey].push(r);
    });
    let cidx = 0;
    rows.forEach(r=>{
      const k = rowEffKey.get(r);
      if(!k || groupColor[k] || (groupSize[k]||0) < 2) return;
      groupColor[k] = 'bulk-c' + ((cidx % 12) + 1);
      cidx++;
    });
  }
  function effBulkKey(r){ return rowEffKey.get(r) || null; }

  // === Pre-cálculo de grupos SECUENCIALES (sólo color visual) ===
  // No tienen bulk SE69, pero comparten SE1 y día de fabricación: se ejecutan
  // de forma consecutiva en la máquina. Las pintamos del mismo color para
  // mostrar esa continuidad, pero SIN etiqueta "Bulk X ud" y SIN enlazar
  // las casillas "Lanzada" (cada órden se lanza por separado).
  const rowSeqKey = new Map();
  const seqColor = {};
  const seqSize  = {};
  if(seqKeyFn){
    rows.forEach(r=>{
      const k = seqKeyFn(r);
      if(!k) return;
      rowSeqKey.set(r, k);
      seqSize[k] = (seqSize[k]||0) + 1;
    });
    let sidx = 0;
    rows.forEach(r=>{
      const k = rowSeqKey.get(r);
      if(!k || seqColor[k] || (seqSize[k]||0) < 2) return;
      // Paleta desplazada (empezamos por c7) para distinguir visualmente
      // de los grupos BULK reales.
      seqColor[k] = 'bulk-c' + (((sidx + 6) % 12) + 1);
      sidx++;
    });
  }
  function effSeqKey(r){ return rowSeqKey.get(r) || null; }

  function rowLanzadaKey(r){
    if(!lanzadaKey || !rowIdFn) return null;
    const id = rowIdFn(r); if(!id) return null;
    return lanzadaKey+':'+id;
  }
  function isLanzada(r){
    const k = rowLanzadaKey(r);
    return k ? lanzadaStorageGet(k) : false;
  }
  function setLanzadaForRow(r, v){
    // Si la fila pertenece a un grupo bulk, marcar/desmarcar TODAS las del grupo.
    const ek = effBulkKey(r);
    const targets = (ek && groupMembers[ek] && groupMembers[ek].length>1) ? groupMembers[ek] : [r];
    targets.forEach(rr=>{
      const k = rowLanzadaKey(rr);
      if(k) lanzadaStorageSet(k, v);
    });
  }

  let state={sortIdx:-1, asc:true, filters:{}};
  function rowMatches(r){
    for(const idx in state.filters){
      const f=state.filters[idx]; if(!f) continue;
      const c=cols[idx];
      let raw;
      if(c.lanzada) raw = isLanzada(r) ? 'si lanzada' : 'no pendiente';
      else raw = r[c.k];
      const v=(raw===null||raw===undefined?'':String(raw)).toLowerCase();
      if(!v.includes(f)) return false;
    }
    return true;
  }
  function paint(){
    let arr=rows.filter(rowMatches);
    if(state.sortIdx>=0){
      const c=cols[state.sortIdx]; const key=c.sortBy||c.k;
      arr=arr.slice().sort((a,b)=>{
        let va=a[key], vb=b[key];
        if(c.n){va=Number(va)||0; vb=Number(vb)||0;}
        else {va=String(va||'').toLowerCase(); vb=String(vb||'').toLowerCase();}
        if(va<vb) return state.asc?-1:1;
        if(va>vb) return state.asc?1:-1;
        return 0;
      });
    }
    tbody.innerHTML='';
    const frag=document.createDocumentFragment();
    let lanzadasCount = 0;
    // Mostrar el badge "Bulk X ud" al inicio de CADA bloque visual contiguo
    // del mismo grupo, no solo la primera aparición global. Si el grupo está
    // partido por filas intermedias de otros SE69, cada tramo lleva su propio badge.
    let prevBkey = null;
    arr.forEach(r=>{
      const tr=document.createElement('tr');
      let bkey=null, bclass=null, showBadge=false;
      if(bulkKeyFn){
        bkey = effBulkKey(r);
        if(bkey && groupColor[bkey]){
          bclass = groupColor[bkey];
          if(bkey !== prevBkey){ showBadge=true; }
        }
      }
      // Si no hay BULK real, intentamos colorear como grupo secuencial.
      if(!bclass && seqKeyFn){
        const sk = effSeqKey(r);
        if(sk && seqColor[sk]) bclass = seqColor[sk];
      }
      prevBkey = bkey;
      const lanz = isLanzada(r);
      if(lanz) lanzadasCount++;
      const classes=[];
      if(bclass) classes.push(bclass);
      if(lanz) classes.push('lanzada-row');
      if(classes.length) tr.className = classes.join(' ');
      cols.forEach(c=>{
        const td=document.createElement('td');
        if(c.lanzada){
          const cb=document.createElement('input');
          cb.type='checkbox';
          cb.className='lanzada-cb';
          cb.checked = lanz;
          const ek_cb = effBulkKey(r);
          const linked = !!(ek_cb && groupMembers[ek_cb] && groupMembers[ek_cb].length>1);
          cb.title = linked
            ? 'Marcar la orden como LANZADA (se guarda en este navegador). Esta fila pertenece a un BULK SE69, así que al marcarla se marcan también el resto de filas del grupo.'
            : 'Marcar la orden como LANZADA (se guarda en este navegador). Cada órden se lanza por separado.';
          cb.addEventListener('change', ()=>{
            setLanzadaForRow(r, cb.checked);
            paint();
          });
          td.appendChild(cb);
          td.style.textAlign='center';
        } else {
          const raw=r[c.k];
          if(c.render) td.innerHTML=c.render(raw, r);
          else if(c.n){td.textContent=fmt(raw); td.style.textAlign='right';}
          else td.textContent=raw===null||raw===undefined?'':String(raw);
          if(c.k==='qty' && showBadge){
            const dot='<span class="bulk-dot" style="background:'+bulkDotColor(bclass)+'"></span>';
            const inner = td.innerHTML;
            // Badge a la IZQUIERDA del qty para que el número quede alineado a la derecha igual que el resto de filas del grupo.
            td.innerHTML = '<span class="bulk-total" title="Bulk SE69 — suma total del grupo sombreado (máx '+BULK_CAP+' ud)">Bulk '+FMT.format(groupTotal[bkey])+' ud</span> ' + dot + inner;
            td.style.textAlign='right';
          }
        }
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    let txt = arr.length+' filas';
    if(lanzadaKey) txt += ' · ✓ '+lanzadasCount+' lanzadas';
    countText.textContent = txt;
  }
  function applyFilters(e){
    const idx=e.target.dataset.col; const v=e.target.value.trim().toLowerCase();
    if(v) state.filters[idx]=v; else delete state.filters[idx];
    paint();
  }
  function sortBy(idx){
    if(cols[idx] && cols[idx].lanzada) return;
    if(state.sortIdx===idx) state.asc=!state.asc;
    else {state.sortIdx=idx; state.asc=true;}
    paint();
  }
  function bulkDotColor(cls){
    const M={'bulk-c1':'#F9A825','bulk-c2':'#00897B','bulk-c3':'#D81B60','bulk-c4':'#3949AB',
             'bulk-c5':'#E64A19','bulk-c6':'#7CB342','bulk-c7':'#5E35B1','bulk-c8':'#C0CA33',
             'bulk-c9':'#039BE5','bulk-c10':'#E53935','bulk-c11':'#6D4C41','bulk-c12':'#546E7A'};
    return M[cls]||'#999';
  }
  const countEl=document.createElement('div');
  countEl.style.cssText='font-size:12px;color:#666;margin-top:6px;display:flex;align-items:center;gap:10px;';
  const countText=document.createElement('span');
  countEl.appendChild(countText);
  if(lanzadaKey){
    const btn=document.createElement('button');
    btn.className='lanzada-clear';
    btn.textContent='Limpiar lanzadas';
    btn.title='Desmarca todas las casillas Lanzada de esta tabla';
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Desmarcar todas las casillas Lanzada de esta tabla?')) return;
      rows.forEach(r=>{ const k = rowLanzadaKey(r); if(k) lanzadaStorageSet(k, false); });
      paint();
    });
    countEl.appendChild(btn);
  }
  wrap.appendChild(tbl);
  container.appendChild(wrap);
  container.appendChild(countEl);
  paint();
}

activate('dashboard');
</script>
