.tab-panel { display: none; }
.tab-panel.active { display: block; }

.card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px;

.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #1F3864;

.kpi { background: white; border-radius: 8px; padding: 18px;

.kpi .sub { font-size: 12px; color: #6B7280; margin-top: 4px; }
.kpi.bad .val { color: #9C0006; }
.kpi.ok .val { color: #006100; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th { background: #1F3864; color: white; padding: 10px 8px;
           text-align: center; font-weight: 600; font-size: 11.5px;
           position: sticky; top: 0; z-index: 2; }
tbody td { padding: 7px 8px; border-bottom: 1px solid #E5E7EB; vertical-align: middle; }
tbody tr:hover { background: #F9FAFB; }
.text-left { text-align: left; }
.text-center { text-align: center; }
.font-bold { font-weight: 600; }

tr.section td { background: #D9E1F2; font-weight: 600; color: #1F3864;
                padding: 10px 12px; font-size: 12px; }

td.cob { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums;
         padding: 6px 4px; min-width: 60px; }
td.cob.ok { background: #C6EFCE; color: #006100; }
td.cob.bad { background: #FFC7CE; color: #9C0006; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 12px;
         font-size: 11px; font-weight: 600; }
.badge.ok { background: #C6EFCE; color: #006100; }
.badge.bad { background: #FFC7CE; color: #9C0006; }
.badge.assigned { background: #DDEBF7; color: #1F4E78; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
           align-items: center; }
.filters label { font-size: 12px; color: #4B5563; font-weight: 500; }
.filters select, .filters input { padding: 6px 10px; border: 1px solid #D1D5DB;

                                  font-family: inherit; background: white; }

.scroll-x { overflow-x: auto; }
.scroll-y { overflow-y: auto; max-height: calc(100vh - 280px); }

.matrix-meta { font-size: 12px; color: #6B7280; margin-bottom: 12px; line-height: 1.5; }

td.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 12px; }
td.ref { font-weight: 600; color: #1F3864; }

const fmt = n => n === null || n === undefined ? '' : new Intl.NumberFormat('es-ES').format(n);
const fmtCob = n => {
  if (n === null || n === undefined) return '';
  if (n >= 0) return 'ok';
  return fmt(n);  // ya viene con signo negativo
};
const cobClass = n => n >= 0 ? 'ok' : 'bad';

// ---------- DASHBOARD ----------
function renderDashboard() {
  const totalRefs = DATA.kpis.reduce((s,k)=>s+k.refs_total,0);
  const totalRiesgo = DATA.kpis.reduce((s,k)=>s+k.refs_riesgo,0);
  const totalFalta = DATA.kpis.reduce((s,k)=>s+k.unidades_a_fabricar,0);
  const totalLotes = DATA.estado.length;
  const lotesFabricar = DATA.estado.filter(e=>e.estado==='Fabricar').length;

  let h = `
    <div class="kpi-grid">
      <div class="kpi"><div class="lbl">Referencias monitorizadas</div><div class="val">${fmt(totalRefs)}</div></div>
      <div class="kpi ${totalRiesgo>0?'bad':'ok'}"><div class="lbl">Referencias en riesgo</div>
           <div class="val">${fmt(totalRiesgo)}</div>
           <div class="sub">${((totalRiesgo/totalRefs)*100).toFixed(1)}% del total</div></div>
      <div class="kpi ${totalFalta>0?'bad':'ok'}"><div class="lbl">Unidades a fabricar</div>
           <div class="val">${fmt(totalFalta)}</div>
           <div class="sub">déficit máx. agregado en 6 sem.</div></div>
      <div class="kpi"><div class="lbl">Lotes PA totales</div><div class="val">${fmt(totalLotes)}</div>
           <div class="sub">${fmt(lotesFabricar)} requieren fabricar stent</div></div>
    </div>

    <div class="card">
      <h2>Resumen por familia</h2>
      <table>
        <thead><tr>
          <th class="text-left">Familia</th><th>Refs total</th><th>Refs en riesgo</th>
          <th>Unidades a fabricar</th><th>% en riesgo</th>
        </tr></thead>
        <tbody>`;
  for (const k of DATA.kpis) {
    const pct = k.refs_total ? (k.refs_riesgo / k.refs_total * 100).toFixed(1) + '%' : '—';
    h += `<tr>
      <td class="text-left font-bold">${k.familia}</td>
      <td class="num">${fmt(k.refs_total)}</td>
      <td class="num"><span class="badge ${k.refs_riesgo>0?'bad':'ok'}">${fmt(k.refs_riesgo)}</span></td>
      <td class="num">${k.unidades_a_fabricar>0?'<span class="badge bad">'+fmt(k.unidades_a_fabricar)+'</span>':'<span class="badge ok">0</span>'}</td>
      <td class="num">${pct}</td>
    </tr>`;
  }
  h += `</tbody></table></div>

    <div class="card">

      <div class="scroll-x"><table>
        <thead><tr>
          <th class="text-left">Familia</th><th class="text-left">Capa</th>
          <th class="text-left">Referencia</th><th class="text-left">Medida</th>
          <th>Déficit (u.)</th><th>Semana</th>
        </tr></thead><tbody>`;
  for (const t of DATA.top) {
    h += `<tr>
      <td class="text-left">${t.familia}</td>
      <td class="text-left">${t.capa}</td>
      <td class="text-left font-bold">${t.ref}</td>
      <td class="text-left">${t.medida||''}</td>
      <td class="num"><span class="badge bad">${fmt(t.deficit)}</span></td>
      <td class="num">${t.semana}</td>
    </tr>`;
  }
  h += `</tbody></table></div></div>`;
  document.getElementById('panel-dashboard').innerHTML = h;
}

// ---------- FAMILIA MATRIX ----------
function renderFamilia(fname) {
  const f = DATA.familias[fname];
  const weekHeaders = DATA.weeks.map(w=>`<th>Sem ${w}</th>`).join('');
  let h = `
    <div class="card">
      <h2>${f.name}</h2>
      <div class="matrix-meta">Cobertura = (Stock libre + Σ planning SE hasta semana W − offset) − (Σ demanda PA no-Asignada hasta W).
        Cada celda es la cobertura acumulada al final de esa semana.</div>
      <div class="scroll-x"><div class="scroll-y"><table>
        <thead><tr>
          <th class="text-left" style="min-width:90px">Referencia</th>
          <th class="text-left" style="min-width:95px;max-width:110px">Medida</th>
          <th>Stock libre</th>
          <th>En curso (total)</th>
          <th>Demanda PA<br/>6 sem</th>
          ${weekHeaders}
        </tr></thead><tbody>`;
  for (const layer of f.layers) {
    const cols = 5 + DATA.weeks.length;
    h += `<tr class="section"><td colspan="${cols}">${layer.title}</td></tr>`;
    if (layer.rows.length === 0) {
      h += `<tr><td colspan="${cols}" style="text-align:center;color:#9CA3AF;font-style:italic">Sin referencias relevantes</td></tr>`;
      continue;
    }
    for (const r of layer.rows) {
      h += `<tr>
        <td class="text-left ref">${r.ref}</td>
        <td class="text-left">${r.medida||''}</td>
        <td class="num">${fmt(r.stock)}</td>
        <td class="num">${fmt(r.en_curso)}</td>
        <td class="num">${fmt(r.dem_6w)}</td>`;
      for (const c of r.cob) {
        h += `<td class="cob ${cobClass(c)}">${fmtCob(c)}</td>`;
      }
      h += `</tr>`;
    }
  }
  h += `</tbody></table></div></div></div>`;
  document.getElementById('panel-'+fname).innerHTML = h;
}

// ---------- PLANNING PA ----------
let planningFilter = { familia:'', estado:'', semana:'', search:'' };

function renderPlanning() {
  const familias = [...new Set(DATA.estado.map(e=>e.familia_dash))].sort();
  const semanas = [...new Set(DATA.estado.map(e=>e.semana).filter(s=>s!==null))].sort((a,b)=>a-b);
  let h = `
    <div class="card">
      <h2>Estado de lotes PA · Cobertura de stents (capa SE directa)</h2>
      <div class="matrix-meta">FIFO por semana. <b>Cubierto (Asignado)</b> = stent ya reservado en stock ·
        <b>Cubierto</b> = stock + planning lo cubre · <b>Fabricar</b> = falta producir stent.</div>
      <div class="filters">
        <label>Familia:</label>
        <select id="f-fam"><option value="">Todas</option>${familias.map(f=>`<option>${f}</option>`).join('')}</select>
        <label>Estado:</label>
        <select id="f-est"><option value="">Todos</option><option>Fabricar</option><option>Cubierto</option><option>Cubierto (Asignado)</option></select>
        <label>Semana:</label>
        <select id="f-sem"><option value="">Todas</option>${semanas.map(s=>`<option>${s}</option>`).join('')}</select>
        <label>Buscar stent / lote:</label>
        <input type="text" id="f-search" placeholder="SE32011 / S20...">
        <span style="margin-left:auto;color:#6B7280;font-size:12px" id="f-count"></span>
      </div>
      <div class="scroll-x"><div class="scroll-y"><table>
        <thead><tr>
          <th class="text-left">Lote PA</th>
          <th class="text-left">Familia (PA)</th>
          <th class="text-left">Familia (dash)</th>
          <th>Semana</th>
          <th class="text-left">Stent</th>
          <th class="text-left">Medida</th>
          <th>Cantidad</th>
          <th class="text-left">Disponibilidad orig.</th>
          <th class="text-left">Estado</th>
        </tr></thead>
        <tbody id="planning-tbody"></tbody>
      </table></div></div>
    </div>`;
  document.getElementById('panel-planning').innerHTML = h;

  const refresh = () => {
    const rows = DATA.estado.filter(e=>{
      if (planningFilter.familia && e.familia_dash !== planningFilter.familia) return false;
      if (planningFilter.estado && e.estado !== planningFilter.estado) return false;
      if (planningFilter.semana && String(e.semana) !== planningFilter.semana) return false;
      if (planningFilter.search) {
        const s = planningFilter.search.toLowerCase();
        if (!e.stent.toLowerCase().includes(s) && !e.lot.toLowerCase().includes(s)) return false;
      }
      return true;
    });
    document.getElementById('f-count').textContent = `${rows.length} lotes filtrados de ${DATA.estado.length}`;
    let body = '';
    for (const e of rows) {
      const badge = e.estado === 'Fabricar' ? 'bad' : (e.estado === 'Cubierto (Asignado)' ? 'assigned' : 'ok');
      body += `<tr>
        <td class="text-left">${e.lot}</td>
        <td class="text-left">${e.familia_pa}</td>
        <td class="text-left">${e.familia_dash}</td>
        <td class="num">${e.semana||''}</td>
        <td class="text-left ref">${e.stent}</td>
        <td class="text-left">${e.medida||''}</td>
        <td class="num">${fmt(e.cantidad)}</td>
        <td class="text-left">${e.disp||''}</td>
        <td class="text-left"><span class="badge ${badge}">${e.estado}</span></td>
      </tr>`;
    }
    document.getElementById('planning-tbody').innerHTML = body;
  };

  document.getElementById('f-fam').addEventListener('change', e => { planningFilter.familia = e.target.value; refresh(); });
  document.getElementById('f-est').addEventListener('change', e => { planningFilter.estado = e.target.value; refresh(); });
  document.getElementById('f-sem').addEventListener('change', e => { planningFilter.semana = e.target.value; refresh(); });
  document.getElementById('f-search').addEventListener('input', e => { planningFilter.search = e.target.value; refresh(); });
  refresh();
}

function switchTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id===('panel-'+name)));
}

document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') switchTab(e.target.dataset.tab);
});

renderDashboard();
for (const fname of DATA.fam_order) renderFamilia(fname);
renderPlanning();
</script>
</body>
</html>
